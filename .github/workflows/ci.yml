# Continuous integration (P0-T2, architecture 4.8).
# Python tests on Windows and macOS, browser tests in Chromium and Firefox,
# and the dependency licence check (SCP-4).
name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  python:
    name: Python tests on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: python -m pip install -r requirements-pipeline.txt
      - name: Licence check
        run: python tools/check_licences.py
      - name: Tests
        run: python -m pytest --ignore=tests/web
      - name: Build the test pack (P1-T3, architecture 11.1)
        run: python -m mapdata --data "${{ runner.temp }}" build test

  web:
    name: Browser tests in Chromium and Firefox
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m playwright install --with-deps chromium firefox
      - name: Cache Pyodide
        uses: actions/cache@v4
        with:
          path: web/vendor
          key: pyodide-${{ hashFiles('tools/fetch_vendor.py') }}
      - name: Fetch Pyodide
        run: python tools/fetch_vendor.py --web --axe
      - name: Browser tests
        # pytest-qt is not needed here, and Qt cannot load on the bare Linux runner.
        run: python -m pytest tests/web -p no:pytest-qt --browser chromium --browser firefox

  installer:
    # The Windows installer and portable zip (AD-20), built on every push so a
    # packaging fault is found at once. Download them from the run's Artifacts.
    name: Windows installer
    needs: python
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: python -m pip install -r requirements-build.txt
      - name: Install NSIS if the runner lacks it
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\NSIS\makensis.exe")) { choco install nsis -y --no-progress }
      - name: Build
        shell: pwsh
        run: .\packaging\build.ps1
      - name: Build the test pack for the installer's self-test
        shell: pwsh
        run: |
          python -m pip install -r requirements-pipeline.txt
          python -m mapdata --data "${{ runner.temp }}\data" build test
      - name: Install silently, self-test, uninstall, and check the folder is empty (P1-T14)
        shell: pwsh
        run: |
          $setup = Get-ChildItem dist_installer -Filter "TobyMap-*-setup.exe" | Select-Object -First 1
          $dir = "${{ runner.temp }}\TobyMapInstalled"
          Start-Process -FilePath $setup.FullName -ArgumentList "/S", "/D=$dir" -Wait
          if (-not (Test-Path "$dir\TobyMap.exe")) { throw "The installer did not install the program." }
          $out = "${{ runner.temp }}\selftest.txt"
          $pack = "${{ runner.temp }}\data\tobymap\output\test\test.pack"
          $p = Start-Process -FilePath "$dir\TobyMap.exe" -ArgumentList "--pack", $pack, "--self-test", "--out", $out -Wait -PassThru
          Get-Content $out
          if ($p.ExitCode -ne 0) { throw "The self-test failed." }
          if (-not (Select-String -Path $out -Pattern "Press F1 for keys")) { throw "The self-test did not announce where it starts." }
          if (-not (Select-String -Path $out -Pattern "tick.wav")) { throw "The earcons are not installed." }
          Start-Process -FilePath "$dir\Uninstall TobyMap.exe" -ArgumentList "/S" -Wait
          Start-Sleep -Seconds 5
          $left = Get-ChildItem $dir -Recurse -ErrorAction SilentlyContinue
          if ($left) { throw "Files were left after uninstalling: $($left.FullName -join ', ')" }
      - uses: actions/upload-artifact@v4
        with:
          name: TobyMap-windows
          path: dist_installer/*
          retention-days: 30
