# The command registry (AD-3): every command, once.
# The key map, the menu bar, F1 help, the key describer and the coverage tests
# are all built from this file. Shells never add their own key handler for a command.
#
# Fields:
#   name: the command name the shells send to the core
#   label: the words used in menus, help and the key describer
#   key: the default key, in the shared key names (see registry.py), or empty
#   region: "map" (only when the map has focus), "panel" (only in the
#     Information panel) or "global" (anywhere)
#   menu: the menu it appears in, or empty for none
#   platforms: desktop, web or both
#   latest_only: if keys arrive faster than they can be handled, only the
#     latest of these is carried out (ANN-3)
#   held: a key that repeats while held; speech waits for the release (ANN-3)
#   pointer: sent by the mouse, touch or a list, so it has no key and no menu
#   toggle: shown in the menu with a tick for on and off

# Menus in order. "access" is the letter that opens the menu with Alt on the
# desktop, such as Alt+H for Help. Browsers keep Alt for their own menus, so the
# web version does not use it.
menus:
  - {label: Map, access: M}
  - {label: Speech, access: S}
  - {label: Settings, access: T}
  - {label: Help, access: H}

# The Information panel's groups, in order (UX section 6). The session makes them in this order,
# and each has its Shift and number key from it. A new group is added here.
panel_groups: [within, nearby, crossed]

commands:
  # Moving (NAV-1). Arrow keys step north, south, west and east.
  - {name: move.north, label: Step north or forward, key: Up, region: map, menu: Map, latest_only: true, held: true}
  - {name: move.south, label: Step south or back, key: Down, region: map, menu: Map, latest_only: true, held: true}
  - {name: move.west, label: Step west or turn left, key: Left, region: map, menu: Map, latest_only: true, held: true}
  - {name: move.east, label: Step east or turn right, key: Right, region: map, menu: Map, latest_only: true, held: true}
  # Zoom and step (NAV-2, NAV-13).
  - {name: zoom.out, label: Zoom out, key: Page Up, region: map, menu: Map}
  - {name: zoom.in, label: Zoom in, key: Page Down, region: map, menu: Map}
  - {name: step.larger, label: Larger step, key: Shift+Page Up, region: map, menu: Map}
  - {name: step.smaller, label: Smaller step, key: Shift+Page Down, region: map, menu: Map}
  # S, from the PO's note on checklist 13.6. On the map only, so letters in the Information panel
  # still go to the item starting with that letter.
  - {name: step.link, label: Link step to zoom, key: S, region: map, menu: Map, toggle: true}
  # Orientation and turning (NAV-3, NAV-11, NAV-12). Left and Right also turn, in the facing orientations.
  - {name: orientation.cycle, label: "Change orientation: north-fixed, cardinal facing, free facing", key: O, region: map, menu: Map}
  # Every key that goes round a list goes back with Shift (P2-T17l, the PO's note on desktop checklist 4.4).
  - {name: orientation.previous, label: "Change orientation the other way: free facing, cardinal facing, north-fixed", key: Shift+O, region: map, menu: Map}
  - {name: turn.left, label: Large turn left in free facing, key: Shift+Left, region: map, menu: Map}
  - {name: turn.right, label: Large turn right in free facing, key: Shift+Right, region: map, menu: Map}
  - {name: turn.fine_left, label: Fine turn left in free facing, key: Ctrl+Left, region: map, menu: Map}
  - {name: turn.fine_right, label: Fine turn right in free facing, key: Ctrl+Right, region: map, menu: Map}
  # Ctrl+B and Ctrl+G work from the map, the Information panel and Details (P2-T17k, desktop
  # checklist 10.5), so they are global; the focus comes back to where they were pressed.
  - {name: bearing.type, label: Type a bearing, key: Ctrl+B, region: global, menu: Map}
  # The orientation beacon (SON-10): your key, from the key list.
  - {name: beacon.toggle, label: Orientation beacon, key: B, region: map, menu: Map, toggle: true}
  # Going to coordinates and back through the places you have been (NAV-8, NAV-10).
  - {name: goto.coordinates, label: Go to coordinates, key: Ctrl+G, region: global, menu: Map}
  - {name: history.back, label: Back to the previous place, key: "Alt+,", region: map, menu: Map}
  - {name: history.forward, label: Forward to the next place, key: "Alt+.", region: map, menu: Map}
  # The layers list (SCP-6, SCP-7).
  - {name: layers.open, label: Layers, key: Ctrl+Shift+L, region: global, menu: Map}
  # Themes and isolate (VIS-2): your keys, from the key list. Escape is kept for the screen reader and the browser.
  - {name: theme.next, label: Next theme, key: T, region: map, menu: Map}
  - {name: theme.previous, label: Previous theme, key: Shift+T, region: map, menu: Map}
  - {name: isolate.toggle, label: Isolate the current area, key: Ctrl+I, region: map, menu: Map, toggle: true}
  # Where am I (LOC-1, LOC-7).
  - {name: where.am_i, label: Where am I, key: Space, region: map, menu: Map}
  - {name: where.coordinates, label: Coordinates, key: C, region: map, menu: Map}
  - {name: where.heading, label: Heading, key: H, region: map, menu: Map}
  - {name: where.visible, label: Size of the visible map, key: V, region: map, menu: Map}
  # Going to a region (DP106). From anywhere.
  - {name: focus.map, label: Go to the map, key: F2, region: global, menu: Map}
  - {name: focus.panel, label: Go to the Information panel, key: F3, region: global, menu: Map}
  - {name: focus.details, label: Go to Details, key: F4, region: global, menu: Map}
  # The Information panel's groups (INF-10, DP109): one command for each group in panel_groups,
  # below, named panel.<group>, with Shift+1 for the first, Shift+2 for the second, and so on,
  # for as many groups as there are (the PO's answer, 8 November 2026). "{group}" is the group's name.
  - {name: panel.group, label: "Go to {group}", key: "Shift+{number}", region: global, menu: Map, each_panel_group: true}
  # Hear its direction (DP143, SON-3): your key, from the key list. On an item of Nearby or Crossed and passed.
  - {name: panel.hear, label: Hear its direction, key: Space, region: panel, menu: ""}
  # Enter on an item goes there: to a point, or to an area's centre (P2-T17k, INF-10, DP155).
  - {name: panel.go, label: Go there, key: Enter, region: panel, menu: ""}
  - {name: app.exit, label: Exit, key: "", region: global, menu: Map, platforms: [desktop]}
  # Speech (ANN-4, SON-7).
  - {name: speech.repeat, label: Repeat the last announcement, key: Shift+Space, region: global, menu: Speech}
  - {name: speech.history, label: Announcement history, key: Ctrl+Shift+Space, region: global, menu: Speech}
  - {name: sound.mute, label: Mute all sound, key: Ctrl+M, region: global, menu: Speech, toggle: true}
  # The verbosity presets (ACC-5, DP144): your key, from the key list.
  - {name: verbosity.next, label: Next verbosity preset, key: A, region: map, menu: Speech}
  - {name: verbosity.previous, label: Previous verbosity preset, key: Shift+A, region: map, menu: Speech}
  - {name: speech.braille_test, label: Send a Braille-only message, key: "", region: global, menu: Speech}
  # Settings (PLT-5, ACC-3).
  - {name: settings.open, label: Settings, key: "Ctrl+,", region: global, menu: Settings}
  # Help (ACC-3, DAT-9, DEL-4).
  - {name: help.keys, label: Keys for this region, key: F1, region: global, menu: Help}
  - {name: help.describer, label: Key describer, key: Shift+F1, region: global, menu: Help, toggle: true}
  - {name: help.about, label: About TobyMap, key: "", region: global, menu: Help}
  - {name: help.about_data, label: About the data, key: "", region: global, menu: Help}
  - {name: help.earcons, label: The sounds, key: "", region: global, menu: Help}
  - {name: diagnostics.copy, label: Copy diagnostics, key: "", region: global, menu: Help}
  - {name: diagnostics.timing, label: Drawing speed, key: "", region: global, menu: Help}
  # Tab does not reach the menu bar (DP93). The desktop uses Alt; browsers keep
  # Alt for themselves, so the web version has this key. It focuses the first
  # menu, Map, without opening it.
  - {name: focus.menu, label: Go to the menu bar, key: Ctrl+Alt+M, region: global, menu: "", platforms: [web]}
  # Sent by the shells for the mouse, touch and the lists, so not in a menu and with no key.
  - {name: map.click, label: Move the location to a clicked point, key: "", region: map, menu: "", pointer: true}
  - {name: map.zoom_to, label: Zoom with the wheel or a pinch, key: "", region: map, menu: "", pointer: true}
  - {name: map.drag, label: Turn the globe by dragging, key: "", region: map, menu: "", pointer: true}
  - {name: map.hover, label: Describe the point under the mouse, key: "", region: map, menu: "", pointer: true}
  - {name: panel.select, label: Select an item in the Information panel, key: "", region: global, menu: "", pointer: true}
  - {name: keys.remap, label: Change the key of a command, key: "", region: global, menu: "", pointer: true}
  - {name: sound.preview, label: Play a sound from the list of sounds, key: "", region: global, menu: "", pointer: true}
  - {name: settings.set, label: Change a setting, key: "", region: global, menu: "", pointer: true}
  - {name: layers.set, label: Change a layer, key: "", region: global, menu: "", pointer: true}
  - {name: layers.check, label: Check a layer's zoom range, key: "", region: global, menu: "", pointer: true}
  - {name: bearing.set, label: Face the typed bearing, key: "", region: map, menu: "", pointer: true}
  - {name: goto.set, label: Go to the typed coordinates, key: "", region: map, menu: "", pointer: true}
  - {name: history.go, label: Go to the place of an announcement history entry, key: "", region: global, menu: "", pointer: true}
