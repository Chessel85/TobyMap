# Default settings (artefacts section 4). Spike S5 values.

start:
  lat: 52
  lon: -1
  zoom: 1          # 1 is the whole globe

# Zoom levels: scale is the globe's size compared with the whole-globe view;
# step is how far one arrow key turns the globe, in degrees.
zooms:
  - {scale: 1, step: 10}
  - {scale: 2, step: 5}
  - {scale: 4, step: 2}
  - {scale: 8, step: 1}
  - {scale: 16, step: 0.5}

nearby_count: 8
