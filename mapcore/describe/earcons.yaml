# The earcons (SON-6, SON-8): event, file name in the sounds folder, and the words
# for Help. Each is in the Earcons tab's list of Settings, with a check box to play it,
# its own volume and your own file (P2-T8, P2-T17p, DP163). phase says when it was first
# played: tick and blocked are the PO's own sounds (DP128); ding and ambiguous_up wait for
# driving and hierarchy mode, and no_data for network mode. listed: false means it is not
# in that list: the orientation beacon has its switch, volume and own file in the Sound
# tab, with its other settings (P2-T9, P2-T17p).
- {event: tick, file: click.wav, label: Tick, meaning: "A step that changed nothing.", phase: 1}
- {event: blocked, file: bump.wav, label: Blocked, meaning: "A step that could not be taken, such as at a pole.", phase: 1}
- {event: crossed_added, file: crossed-added.wav, label: Something added, meaning: "Something was added to the Crossed and passed list.", phase: 2}
- {event: ding, file: ding.wav, label: Ding, meaning: "Passing a point of interest while driving.", phase: 2}
- {event: no_data, file: no-data.wav, label: No data, meaning: "There is no data here for what you asked.", phase: 2}
- {event: ambiguous_up, file: ambiguous-up.wav, label: Ambiguous up, meaning: "More than one way up in the hierarchy.", phase: 2}
- {event: beyond_view, file: beyond-view.wav, label: Beyond the view, meaning: "A sound from beyond the view, when Sounds beyond the view is set to a fixed tone.", phase: 2}
- {event: item_direction, file: item-direction.wav, label: Item's direction, meaning: "Played from an item's direction, before its name, in Hear its direction, when its layer has no sound of its own.", phase: 2}
- {event: line_crossing, file: line-crossing.wav, label: Line crossed, meaning: "Crossing a line of a layer that has a crossing sound.", phase: 2}
- {event: meridian_crossed, file: meridianCrossed.wav, label: Meridian crossed, meaning: "Crossing the prime meridian or the 180 degree meridian.", phase: 2}
- {event: equator_crossed, file: equatorCrossed.wav, label: Equator or tropic crossed, meaning: "Crossing the equator, a tropic or a polar circle.", phase: 2}
- {event: beacon, file: beacon.wav, label: Orientation beacon, meaning: "Repeated from the direction of the North Pole while the beacon is on. B switches it on and off.", phase: 2, listed: false}
