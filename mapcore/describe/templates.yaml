# Announcement templates (architecture 3.4). Every word the application says
# comes from here. The tests in tests/mapcore/test_session.py hold the approved
# wording for spike S5, so a change here must be made there too.
#
# Values in braces are filled in by the core.

start: "TobyMap. {place}. Press F1 for keys."
# The map's name as the focus first arrives on it at start. The screen reader reads
# it after the window's title, TobyMap, so the start is heard in full once (P2-T17d).
start_label: "{place}. Press F1 for keys."
# The map region's name, which the screen reader says when Tab arrives on the
# map. Just the place, as the PO asked after testing spike S5.
map_label: "{place}"
off_globe: "Not on the globe."
braille_test: "TobyMap Braille test: {place}"
braille_fallback: "Braille-only messages need NVDA, and it was not found."
braille_web: "Braille-only messages are not possible in a web browser. The screen reader shows announcements in Braille as well as speaking them."
timing: "Last frame: worked out in {project} milliseconds, painted in {paint} milliseconds, {points} points."
timing_unknown: "an unknown number of"
timing_startup: "Start-up took {seconds} seconds."
visible:
  area: "Visible map: {width} wide by {height} high."

# Names of the four regions and other window words (UX section 2).
ui:
  window_title: TobyMap
  map: Map
  panel: Information panel
  details: Details
  menu_bar: Menu bar
  close: Close
  ok: OK
  cancel: Cancel
  copy: Copy
  play: Play
  settings_title: Settings
  keys_tab: Keys
  key_change: Change key
  key_clear: No key
  key_prompt: "Press the key you want for this command."
  key_field: Key
  key_message: Message
  no_key: no key
  export: Export settings
  import: Import settings
  # Your own sound file for an earcon, in the Earcons tab of Settings (P2-T8, SON-8)
  choose_file: Browse
  use_default: Use the default
  choose_file_for: "Browse"   # the label alone, as the PO asked (P2-T18f)
  use_default_for: "Use the default for {name}"
  default_sound: The default sound
  sound_files: "Sound files (*.wav)"
  file_unreadable: "{file} could not be read as a WAV sound file, so the sound is not changed."
  loading: "Loading TobyMap. This can take a few seconds the first time."

panel:
  within: Within
  nearby: Nearby
  crossed: Crossed and passed
  contains: Contains
  bordering: Bordering
  overlapping: Overlapping
  crossing: Crossing
  search: Search
  # A group about the current feature names it in its heading (LOC-4, P3-T4a): "Bordering France",
  # then with its count, "Bordering France, 8 items". Before it is opened it has no count yet.
  about: "{group} {name}"
  # A group heading with how many items it holds (P2-T17k, desktop checklist 10.4).
  count_none: "{group}, no items"
  count_one: "{group}, 1 item"
  count: "{group}, {count} items"
  empty_later: "Nothing yet. This group is filled from Phase 2."

details:
  nothing: "No area here."
  type: "Type: {value}"
  layers:
    countries: country
    regions: first-level division
    counties: county
    oceans: ocean or sea
    rivers: river
    lakes: lake
    roads: road
    railways: railway line
    towns: city or town
    stations: railway station
    continents: continent
    seas: sea, bay or strait
    sea-places: sea, bay or strait
    islands: island
    mountain-ranges: mountain range
    physical-regions: physical region
    peaks: peak
    national_parks: national park
  # An area's tier (P3-T17, DP165), said in place of its layer's word, with the area above it:
  # "constituent country of the United Kingdom", "region of France", "county of England".
  # The tiers are listed in mapdata/config/tiers.yaml.
  tiers:
    country: country
    constituent_country: constituent country
    region: region
    county: county
  tier_of: "{tier} of {owner}"
  # A country's distant part with no region of its own, such as Wake Island: "part of the United States" (DP191).
  distant_part: part
  # Land the build names itself, in the Countries layer, said by its type, not as a country (P3-T2c, DP120).
  own_types: [disputed land, unclaimed land, condominium, territory]
  # A name with one of these words is said with "the" after "of": "of the United Kingdom".
  the_words: [Kingdom, States, Republic, Islands, Isle, Isles, Emirates, Federation, Union, Netherlands,
              Philippines, Bahamas, Maldives, Seychelles, Comoros]
  part_of: "Part of: {value}"
  disputed: "This land is disputed."
  # Who claims it, each with equal credit, in the order of their names (DP119), and the source's view (ANN-6, DAT-8).
  claimants: "Claimed by: {value}"
  dispute_view: "{source}: {view}"
  dispute_view_named: "{source}, for {name}: {view}"
  also_held_as: "OpenStreetMap also has this area as {name}."
  area: "Area: {value}"
  # Facts from Wikidata, each with its source and date (P3-T2b, INF-1, DAT-7). The date is the fact's own, such
  # as a census's; a fact with none is dated by when it was fetched.
  facts:
    population: Population
    area_km2: "Area, as published"
    capital: Capital
    elevation_m: Elevation
    length_km: Length
    official_name: Official name
  fact: "{name}: {value}, from {source}, {date}"
  fact_fetched: "{name}: {value}, from {source}, as fetched on {date}"
  wikipedia: "Wikipedia article: {value}"
  wikipedia_opening: "Opening the Wikipedia article for {name}."
  wikipedia_none: "No Wikipedia article for {name}."
  months: [January, February, March, April, May, June, July, August, September, October, November, December]
  centre: "The location is {value}"
  source: "Source: {value}"

beacon:
  "on": "Beacon on."
  "off": "Beacon off."
  on_near_pole: "Beacon on, but silent near {target}."
  on_muted: "Beacon on, but all sound is muted."
  near_pole: "Beacon off near {target}."
  back: "Beacon back on."
# Themes, the map display setting and isolate (P2-T12; VIS-2, DP108).
display:
  theme: "{theme} theme."
  colour_refused: "{what}: that colour is too close to the colours around it for the 7 to 1 contrast of a high contrast theme, so the theme's own colour is used."
  isolated: "Isolated: {name}. Only it is on the map. Press Ctrl+I again to show everything."
  isolate_off: "Showing everything."
  isolate_none: "No area here to isolate."

# The verbosity presets (P2-T11; ACC-5, DP144), said by the key that goes to the next one.
verbosity:
  terse: "Terse. Only the smallest area that changed is said."
  normal: "Normal. Every area that changed is said, and the zoom, the step and the heading."
  detailed: "Detailed. The whole place is said when an area changes, and the heading after each step in free facing."
sound:
  muted: "Sound muted."
  unmuted: "Sound on."
  own_file_failed: "Your own sound file for {sound} could not be played, so the default sound is used."
  no_device: "No sound device was found, so sounds placed around you are silent. Speech and the other sounds carry on."
  no_hrtf: "The HRTF sound data is missing, so stereo is used instead. Reinstalling TobyMap puts it back."

# Hear its direction (DP143, SON-3): the label said in the spatial voice, from the item's place.
hear:
  label: "{name}, {distance}"

# The spatial voice (P2-T7, SON-3). Each is said once, by the screen reader.
voice:
  loading: "The spatial voice is still starting. Try again in a few seconds."
  missing: "The spatial voice is not installed, so labels are not spoken in space. They still go to Braille."
  failed: "The spatial voice could not be started, so labels are not spoken in space. They still go to Braille."

settings:
  title: Settings
  bad_value: "That value cannot be used for this setting."

keys:
  taken: "{key} is already used by {other}. Choose another key."
  invalid: "{key} is not a key TobyMap can use."
  changed: "{label} is now {key}."
  cleared: "{label} has no key now."

# Keys that are a symbol are said as a word, because a screen reader may not
# say punctuation (PO feedback on checklist 2, second pass): "Ctrl+Comma". A
# symbol not listed here is named from its Unicode name.
key_names:
  ",": Comma
  ".": Full stop
  "/": Slash
  "\\": Backslash
  ";": Semicolon
  "'": Apostrophe
  "#": Hash
  "[": Left bracket
  "]": Right bracket
  "-": Minus
  "=": Equals
  "+": Plus
  "`": Grave accent
  "<": Less than
  ">": Greater than
  "?": Question mark
  "!": Exclamation mark
  "*": Star
  "&": Ampersand

describer:
  started: "Key describer on. Press a key to hear what it does. Nothing is carried out. Press Shift+F1 again to leave."
  stopped: "Key describer off."
  key: "{key}: {label}"
  unassigned: "{key}: no command."
  # A key with commands in more than one region: each one with where it works.
  several: "{key}: {list}"
  in_region: "{label}, {region}."
  regions:
    global: anywhere
    map: on the map
    panel: in the Information panel
    details: in Details

diagnostics:
  title: Diagnostics

# The two boxes where you type: a bearing (NAV-12) and coordinates (NAV-8).
typing:
  bearing_title: "Type a bearing"
  # The label alone, with no help line (the PO's note on desktop checklist 3.5).
  bearing_label: "Enter a bearing in degrees, or a compass direction:"
  bearing_help: ""
  # A wrong entry opens a message box with these words and an OK button; after OK you are back in
  # the box with your text (P2-T17o, desktop checklist 3.5 and 5.3). {entry} is what was typed.
  bearing_error: "{entry} is not a valid bearing. Enter a value in degrees in the range 0 to 360. Or enter a compass direction such as north or SW."
  bearing_empty: "No bearing was entered. Enter a value in degrees in the range 0 to 360. Or enter a compass direction such as north or SW."
  goto_title: "Go to coordinates"
  goto_label: "Enter latitude and longitude:"
  goto_help: ""
  goto_error: "{entry} is not a valid entry. Enter latitude and then longitude, such as 51.5, -0.12 or 51d 30m N, 0d 7m W. Latitude is up to 90 degrees and longitude up to 180. Or enter one of them alone to keep the other. Or enter a direction and degrees to move, such as north 5. In cardinal or free facing, enter f or b and a distance to move forward or back, such as f 24 or b 2 km 500 m."
  goto_facing_only: "Forward and back work in cardinal and free facing. Press O to change the orientation, or enter where to go."
  goto_empty: "Nothing was entered. Enter latitude and then longitude, such as 51.5, -0.12 or 51d 30m N, 0d 7m W. Latitude is up to 90 degrees and longitude up to 180. Or enter one of them alone to keep the other. Or enter a direction and degrees to move, such as north 5. In cardinal or free facing, enter f or b and a distance to move forward or back, such as f 24 or b 2 km 500 m."

dialogs:
  keys_title: Keys
  # One short sentence a line, so a screen reader moves through it a line at a
  # time (PO feedback on checklist 2, second pass).
  keys_intro_region:
    - "These are the commands that work when the {region} has focus."
    - "Tab and Shift+Tab move between the regions."
    - "F2 goes to the map, F3 to the Information panel and F4 to Details."
  keys_line: "{label}: {key}"
  keys_menu_only: "{label}: in the {menu} menu"
  about_title: About TobyMap
  # One line each, so the screen reader reads them one at a time (PO note on checklist 1.3).
  about_text: |-
    TobyMap version {version}.
    An accessible map for blind and partially sighted people.
    TobyMap is free software under the GNU General Public License version 3.
    The spatial voice is Alba, a Scottish English voice from Piper voices, made from recordings by the University of Edinburgh, licensed CC-BY 4.0.
    Every library and its licence is in THIRD_PARTY_NOTICES.txt, in the folder TobyMap is installed in.
  data_title: About the data
  data_pack: "{name}, version {version}, built {built}."
  data_none: "No map pack is installed."
  earcons_title: The sounds
  earcons_line: "{name}, {file}: {meaning}"

# ---- Phase 1 wording (P1-T7; ANN-1, ANN-4, ANN-5, LOC-1, LOC-7, INF-3, INF-7) ----

# Units: [singular, plural]. "1 kilometre", "2 kilometres".
units:
  m: [metre, metres]
  km: [kilometre, kilometres]
  yd: [yard, yards]
  mi: [mile, miles]
  nmi: [nautical mile, nautical miles]
  ft: [foot, feet]
  km2: [square kilometre, square kilometres]
  mi2: [square mile, square miles]

# Bearings, by the kinds in mapcore.geo.formats.
bearing:
  degrees: "{value} degrees"
  about_degrees: "about {value} degrees"
  clock: "{value} o'clock"
  point: "{value}"

# The 32 points of the compass, as words.
points:
  N: north
  NbE: north by east
  NNE: north-north-east
  NEbN: north-east by north
  NE: north-east
  NEbE: north-east by east
  ENE: east-north-east
  EbN: east by north
  E: east
  EbS: east by south
  ESE: east-south-east
  SEbE: south-east by east
  SE: south-east
  SEbS: south-east by south
  SSE: south-south-east
  SbE: south by east
  S: south
  SbW: south by west
  SSW: south-south-west
  SWbS: south-west by south
  SW: south-west
  SWbW: south-west by west
  WSW: west-south-west
  WbS: west by south
  W: west
  WbN: west by north
  WNW: west-north-west
  NWbW: north-west by west
  NW: north-west
  NWbN: north-west by north
  NNW: north-north-west
  NbW: north by west

# Directions measured from the way the user faces, in cardinal and free facing, when
# the setting asks for them (ANN-5, NAV-12, DP159). The chosen format, with "at your":
# "Berlin, 25 kilometres at your 30 degrees", "at your north-east" (ahead right).
relative:
  degrees: "at your {value} degrees"
  about_degrees: "at about your {value} degrees"
  clock: "at your {value} o'clock"
  point: "at your {value}"

hemispheres:
  N: north
  S: south
  E: east
  W: west

coordinates:
  decimal_angle: "{degrees} degrees {hemisphere}"
  decimal_angle_plain: "{degrees} degrees"
  dms_angle: "{degrees} degrees {minutes} minutes {seconds} seconds {hemisphere}"
  dms_angle_plain: "{degrees} degrees {minutes} minutes {seconds} seconds"
  pair: "{lat}, {lon}"

# Where the location is, and what changed (ANN-1, LOC-2).
place:
  list_separator: ", "
  none: "No area here"
  layers_off: "Every layer here is switched off"
  # Every layer here is on, but none is in its zoom range (DP160).
  out_of_zoom: "No data at this zoom level"
  sea: "Sea"
  # Disputed land is said with "disputed", once, after the largest disputed area of the place (P3-T2c, ANN-6):
  # "Autonomous Republic of Crimea, Crimea, disputed".
  disputed: "{name}, disputed"

# The words after a move that crosses a pole (NAV-1 says the block is silent,
# so there are none here).

movement:
  zoom_step: "Zoom {zoom}, step {step}."
  # Only what changed is said (PO feedback on checklist 7, second pass). When
  # the step is linked to the zoom, both change, so both are said.
  zoom_only: "Zoom {zoom}."
  step_only: "Step {step}."
  zoom_end_out: "Widest zoom. {zoom_step}"
  zoom_end_in: "Closest zoom. {zoom_step}"
  step_end_larger: "Largest step. {zoom_step}"
  step_end_smaller: "Smallest step. {zoom_step}"
  link_on: "Step linked to zoom. {zoom_step}"
  link_off: "Step no longer linked to zoom. {zoom_step}"
  facing: "Facing {heading}."
  orientation:
    north-fixed: "North-fixed."
    cardinal: "Cardinal facing."
    free: "Free facing."
  # After the orientation key (NAV-11, NAV-12). The new facing is said, such as "Free facing, 47 degrees."
  orientation_changed:
    north-fixed: "North-fixed."
    cardinal: "Cardinal facing, {heading}."
    free: "Free facing, {heading}."
  # After a move over a pole (NAV-3).
  pole_crossed: "Crossed the {pole} Pole. Now facing {heading}."
  poles:
    north: "North"
    south: "South"
  mode:
    stepping: "Stepping."
    hierarchy: "Hierarchy mode."
  heading: "{facing} {orientation} {mode} Zoom {zoom}, step {step}."

# The layers list (SCP-6, SCP-7). Layer and group names come from the pack.
layers:
  title: "Layers"
  other_group: "Other layers"
  list: "Layers"
  settings_button: "Settings for this layer"
  settings_title: "Settings for {layer}"
  # The closest zoom a layer is shown at, the smaller distance, is its maximum zoom, and the
  # farthest its minimum zoom: zoomed in most is the most zoom (glossary; P2-T18c, the PO's
  # choice). The keys stay min_zoom and max_zoom, the smaller and larger distance, as stored.
  min_zoom: "Maximum zoom"
  max_zoom: "Minimum zoom"
  every_zoom: "No limit"
  # For an area layer, such as Countries, its border (P2-T17i).
  crossing: "Sound when a line or border of this layer is crossed"
  no_sound: "No sound"
  range_error: "The maximum zoom must not be a larger distance than the minimum zoom."
  choose_layer: "Choose a layer first. The settings are for one layer."
  item_off: "{layer}, off"
  item_on: "{layer}, on"

# Reset all settings, in the Map menu (P2-T18h): as on a new installation on a new computer.
reset:
  title: Reset all settings
  question: "Reset all settings to how they are when TobyMap is first installed? This includes your keys, your layer choices and your own sound files. Your place and your location history are cleared too. This cannot be undone. To keep your settings, choose Cancel, then Export settings in Settings."
  ok: Reset
  done: "All settings are reset, as on a new installation. {place}."

history:
  # The location history: the places you stopped at, which Alt+comma and Alt+full stop go
  # through, newest first (NAV-10, DP158).
  title: Location history
  help: "Newest first. Press Enter on a place to go there. Alt+comma and Alt+full stop go through the same places."
  here: "Here: {place}"
  # Shift+Space with nothing said yet (ANN-4).
  nothing_to_repeat: "Nothing to repeat."

nearby:
  item: "{name}, {distance} {direction}"
  # Under a metre away there is no direction to give, so the place is "here" (P2-T18e).
  here: "{name}, here"
  none: "Nothing nearby."

# A Within item: you are inside it, so the distance and direction are to its centre (P2-T17k, DP155).
within:
  item: "{name}, centre {distance} {direction}"
  here: "{name}, centre here"

# Crossed and passed (ANN-2): what the last move went over or near. The distance and
# direction are from where you are now; closest is how near the path came.
crossed:
  crossed: "{name}, crossed, {distance} {direction}"
  passed_over: "{name}, passed over, {distance} {direction}"
  passed: "{name}, passed, closest {closest}, {distance} {direction}"
  # The move ended on it, under a metre away (P2-T18e).
  crossed_here: "{name}, crossed, here"
  passed_over_here: "{name}, passed over, here"
  passed_here: "{name}, passed, here"
  none: "Nothing crossed or passed on the last move."

# Ctrl+S in the Information panel says the order it chose (P3-T4d); Ctrl+Enter on an item (P3-T4e, DP170).
sort:
  natural: "Sorted in its natural order"
  name: "Sorted by name"
  distance: "Sorted by distance"
  bearing: "Sorted by direction"
bookmark:
  later: "Bookmarks come in Phase 4."

# The groups about the current feature (P3-T4, LOC-4). {name} is the current feature.
# Bordering (INF-2): each neighbour, its direction from where you are, and the length of the shared
# border; or, for an area that only nearly touches, the distance across.
bordering:
  item: "{name}, {direction}, shared border {length}"
  near: "{name}, {direction}, nearly touches, {across} across"
  none: "Nothing borders {name}."
contains:
  heading: "{layer} {count}"
  item: "{name}, {direction}"
  none: "Nothing visible inside {name}."
overlapping:
  item: "{name}, {direction}, {mine} percent of {current} and {theirs} percent of {name} overlap"
  partly: "{name}, {direction}, {share} percent of {current} is inside it"
  none: "Nothing overlaps {name}."
crossing:
  item: "{name}, {direction}"
  crosses: "{name}, {direction}, crosses it"
  along: "{name}, {direction}, along its border"
  none: "Nothing crosses {name}."
search:
  none: "No search yet."

# Hierarchy mode (P3-T6a; NAV-4, NAV-11, DP77). M switches it on and off; the arrow keys go up, down and
# round the neighbours. A move says the feature, then the zoom it was fitted to: "England. Zoom 250 kilometres."
# A neighbour is said as Bordering says it: "Spain, south-west, shared border 452 kilometres. Zoom ..."
hierarchy:
  "on": "Hierarchy mode. {name}."
  on_nothing: "Hierarchy mode. No area here."
  stepping: "Stepping mode."
  moved: "{text}. {zoom}"
  top: "Nothing holds {name}."
  # The ambiguous up: the feature is inside two areas, neither inside the other (NAV-4).
  up_title: "Up from {name}"
  up_help: "{name} is inside more than one area, and neither is inside the other. Choose one to go up to, or Cancel to stay."
  choice: "{name}, {type}"
  # Down: the kinds of visible feature inside, each with its count, then a kind's features (INF-4).
  down_title: "Inside {name}"
  down_help: "Choose a kind of feature, or Cancel to stay."
  kind_title: "{kind} in {name}"
  kind_help: "Choose a feature to go to it, or Cancel to stay."

# Which unit system, bearing style and coordinate format is chosen (ANN-5, LOC-1).
# Why a pack was not opened, or what is wrong with it (PCK-5, NFR-4, P1-T2).
# {name} is the pack's file name.
packs:
  downloading_first: "Downloading the map for the first time. It is kept in this browser, so this happens once."
  downloading: "Downloading the map: {percent} percent."
  download_done: "The map is downloaded."
  none_installed: "No map pack is installed, so TobyMap has no map to show. Open Help, then About the data, for how to get one."
  not_a_pack: "{name} is not a TobyMap pack, so it was not opened."
  newer_format: "{name} needs a newer version of TobyMap, so it was not opened. Update TobyMap to use it."
  app_too_old: "{name} needs TobyMap {need} or later, and this is TobyMap {have}, so it was not opened. Update TobyMap to use it."
  app_too_new: "{name} was made for versions of TobyMap before {before}, and this is TobyMap {have}, so it was not opened. Download the current pack instead."
  damaged_pack: "{name} is damaged, so it was not opened. Download it again. The damage is in its {record}."
  damaged_record: "Part of {name} is damaged, and TobyMap is carrying on without it. Download the pack again. The damaged record is {record}."
  checksum_wrong: "{name} does not match its checksum, so it may be damaged or incomplete. Download it again."

