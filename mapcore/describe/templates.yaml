# The layers list (SCP-6, SCP-7). Layer and group names come from the pack.
layers:
  title: "Layers"
  other_group: "Other layers"
  list: "Layers"
  settings_button: "Settings for this layer"
  settings_title: "Settings for {layer}"
  # The closest zoom a layer is shown at, the smaller distance, is its maximum zoom, and the
  # farthest its minimum zoom: zoomed in most is the most zoom (glossary; P2-T18c, the PO's
  # choice). The keys stay min_zoom and max_zoom, the smaller and larger distance, as stored.
  min_zoom: "Maximum zoom"
  max_zoom: "Minimum zoom"
  every_zoom: "No limit"
  # For an area layer, such as Countries, its border (P2-T17i).
  crossing: "Sound when a line or border of this layer is crossed"
  layer_sound: "Sound of this layer's features in look around and Hear its direction"
  no_sound: "No sound"
  range_error: "The maximum zoom must not be a larger distance than the minimum zoom."
  choose_layer: "Choose a layer first. The settings are for one layer."
  item_off: "{layer}, off"
  item_on: "{layer}, on"
  # Whether the layer's areas have their outlines drawn on the map (P3-T23, DP198).
  outline: "Draw the outlines of its areas"
  # The Bookmarks layer, a layer of TobyMap's own in no pack, in a group of its own (P4-T8f, DP219 point 4).
  bookmarks: "Bookmarks"
  bookmarks_group: "Bookmarks"

# The current layer (P3-T24b, DP202): Shift+Enter on an item of the Information panel.
current_layer:
  chosen: "Current layer: {layer}. {name} is the current feature."
  none_here: "Current layer: {layer}. {layer}: none here, so the current feature is the smallest area, {name}."
  back: "No current layer. The current feature is the smallest area here, {name}."
  no_item: "Choose an item in the Information panel first."

# Map views (P3-T23, DP198): the political and physical views, and your own, chosen in the view manager.
views:
  title: "Map views"
  help: "Choose a view in the list, then OK to use it. Add keeps the layers as they are now as a view of your own. Save changes puts the layers as they are now into the view of your own chosen in the list, and Rename and Delete change your own views. Cancel leaves everything as it was."
  list: "Views"
  item: "{name}"
  item_in_use: "{name}, in use"
  custom: "Custom"
  custom_line: "Custom: your changes to the {name} view, in use"
  add: "Add"
  rename: "Rename"
  delete: "Delete"
  save: "Save changes"
  add_title: "Add the layers as a view"
  rename_title: "Rename {name}"
  name_label: "Name of the view"
  name_help: "A name for your view, such as Rivers and roads. It is kept with your settings."
  added: "Added the {name} view. OK uses it."
  renamed: "{old} is now called {name}."
  deleted: "The {name} view is deleted. Cancel brings it back."
  # Save changes (P4-T14g): the focus does not move, so this is the only word that the layers went into the view.
  saved: "The layers are saved into the {name} view. OK keeps it."
  chosen: "{name} view."
  name_empty: "Type a name for the view."
  name_taken: "There is already a view called {name}. Type another name."

# Reset all settings, in the Map menu (P2-T18h): as on a new installation on a new computer.
reset:
  title: Reset all settings
  question: "Reset all settings to how they are when TobyMap is first installed? This includes your keys, your layer choices and your own sound files. Your place and your location history are cleared too. This cannot be undone. To keep your settings, choose Cancel, then Export settings in Settings."
  ok: Reset
  done: "All settings are reset, as on a new installation. {place}."

history:
  # The location history: the places you stopped at, which Alt+comma and Alt+full stop go
  # through, newest first (NAV-10, DP158).
  title: Location history
  help: "Newest first. Press Enter on a place to go there. Alt+comma and Alt+full stop go through the same places."
  here: "Here: {place}"
  # Shift+Space with nothing said yet (ANN-4).
  nothing_to_repeat: "Nothing to repeat."

# Measuring (INF-3, INF-8, P3-T7a). The border is the nearest point on an area's own boundary, when you are inside it.
measure:
  item: "{name}, nearest point {distance} {direction}"
  border: "{name}, its border {distance} {direction}"
  centre: "{name}, centre {distance} {direction}"
  here: "{name}, here"
  none: "Cannot measure to {name}."
  # An item about one point, such as an end of a shared border (P3-T24f).
  point: "{distance} {direction}"
  # A bookmark in the Bookmarks group (P4-T8c).
  bookmark: "{name}, {distance} {direction}"
  bookmark_here: "{name}, here"
  # The measure start (P4-T9a, USR-4, DP214): Ctrl+Shift+M on an item, then on the map; Shift+M then adds where from.
  start: "Measuring from {name}."
  start_here: "Measuring from where you are."
  from_start: "{text}, from {name}"
  start_gone: "The bookmark {name} is gone, so measuring from where you are."

nearby:
  item: "{name}, {distance} {direction}"
  # Under a metre away there is no direction to give, so the place is "here" (P2-T18e).
  here: "{name}, here"
  none: "Nothing nearby."

# A Within item: you are inside it, so the distance and direction are to its centre (P2-T17k, DP155).
within:
  item: "{name}, centre {distance} {direction}"
  here: "{name}, centre here"
  # The current feature, when it is a line or a place: first in the group, to its nearest point (P3-T29h).
  current_item: "{name}, {distance} {direction}"
  current_here: "{name}, here"

# Passed over (ANN-2): what the last move went over or near. The distance and
# direction are from where you are now; closest is how near the path came.
crossed:
  crossed: "{name}, crossed, {distance} {direction}"
  passed_over: "{name}, passed over, {distance} {direction}"
  passed: "Passed nearby to {name}, closest {closest}, {distance} {direction}"
  # The move ended on it, under a metre away (P2-T18e).
  crossed_here: "{name}, crossed, here"
  passed_over_here: "{name}, passed over, here"
  passed_here: "Passed nearby to {name}, here"
  none: "Nothing crossed or passed on the last move."

# The Bookmarks group of the Information panel, on Shift+8 (P4-T8c, USR-3, DP219): a heading for each list, "Castles, 3
# items", and its bookmarks under it. A bookmark you are at, under a metre away, is "here".
bookmarks_group:
  item: "{name}, {distance} {direction}"
  here: "{name}, here"
  gone: "{name}. {place}"   # Enter: the bookmark's name, then the place there; it is now the current feature (P4-T8d)
  none: "No bookmarks. Press {key} to make one."
  # The Bookmarks layer switched off in Layers, or every list with bookmarks outside its zoom range (P4-T8f, SCP-6).
  layer_off: "The Bookmarks layer is switched off. Switch it on in Layers, in the Map menu."
  out_of_zoom: "No bookmarks at this zoom level."

# The bookmark dialog, on Ctrl+Enter on the map or on an item of the Information panel (P4-T8b, USR-1, DP219).
bookmark:
  title: "Bookmark"
  help: "The name is filled in from the feature and numbered if it is already used. Choose a bookmark list, or make a new one. OK adds the bookmark, and Cancel adds nothing."
  name_label: "Name"
  feature_label: "Feature"
  feature_none: "None"
  coordinates_label: "Coordinates"
  list_label: "Bookmark list"
  new_list: "New list"
  new_list_title: "New bookmark list"
  new_list_label: "Name of the list"
  new_list_help: "A name for the list, such as Castles. The list is made when you press OK in the bookmark dialog."
  name_empty: "Type a name for the bookmark."
  list_name_empty: "Type a name for the list."
  list_name_taken: "There is already a bookmark list called {name}. Type another name."
  # Said once after OK: the focus goes back to the map or the item, which says nothing of it.
  added: "Bookmarked {name} in {list}."

# A bookmark as the current feature (P4-T8d; USR-1, DP219 point 6), after Enter on it in the Bookmarks group. Each
# message after a key is said because nothing else tells it: the focus does not move (P4-T14f's rule).
bookmark_current:
  none: "No bookmark is the current feature. Enter on a bookmark in the Bookmarks group makes it current."
  # Bordering, Contains and Overlapping: a bookmark is a point, with no borders or contents of its own.
  group: "The current feature is the bookmark {name}, which is only a point."
  type: "bookmark"
  list: "Bookmark list: {value}"
  feature: "Feature: {value}"
  note: "Note: {value}"
  # Delete asks first, with Delete and Cancel; Cancel says nothing.
  delete_title: "Delete bookmark"
  delete_question: "Delete the bookmark {name} from {list}?"
  delete_ok: "Delete"
  deleted: "Deleted {name}."
  # Ctrl+Enter: the bookmark dialog, to rename it or move it to another list.
  rename_title: "Rename bookmark"
  rename_help: "Change the name, or choose another bookmark list to move the bookmark there. OK keeps the change, and Cancel changes nothing."
  renamed: "Renamed {old} to {name}."
  moved: "Moved {name} to {list}."
  renamed_moved: "Renamed {old} to {name} and moved it to {list}."
  # Ctrl+C, Ctrl+X and Ctrl+V. The copy is kept in TobyMap, not on the clipboard.
  copied: "Copied {name}."
  cut: "{name} will move when pasted."
  pasted: "Pasted {name} into {list}."
  already_there: "{name} is already in {list}."
  paste_where: "To paste, go to a bookmark list in the Bookmarks group, {key}."
  paste_nothing: "Nothing to paste. Copy or cut a bookmark first."

# The bookmark manager, on Ctrl+Shift+B and in the Map menu (P4-T8e; USR-3, DP219 point 7): the bookmark lists
# themselves. Every change takes effect and is kept at once; Close is the only way out (ACC-7). A line is said with
# its bookmark count and zoom range; whether it is on is the check box. A message is said only where the focus does not
# tell it.
bookmark_manager:
  title: "Bookmark manager"
  help: "Your bookmark lists. Space switches a list on or off. Open list shows the list's bookmarks. Every change takes effect at once. Close when you have finished."
  list: "Bookmark lists"
  new: "New list"
  rename: "Rename"
  open_list: "Open list"
  up: "Move up"
  down: "Move down"
  delete: "Delete list"
  zoom: "Zoom range"
  save_file: "Save to a file"
  open_file: "Open a file"
  new_title: "New bookmark list"
  rename_title: "Rename the bookmark list {name}"
  name_label: "Name of the list"
  name_help: "A name for the list, such as Castles."
  zoom_title: "Zoom range of {name}"
  min_zoom: "Show from"
  max_zoom: "Show up to"
  every_zoom: "No limit"
  # A line: the name, how many bookmarks, and the zoom range when it has one.
  contents_none: "no bookmarks"
  contents_one: "1 bookmark"
  contents: "{count} bookmarks"
  item: "{name}, {contents}"
  item_zoom: "{name}, {contents}, zoom {range}"
  range_from: "from {low}"
  range_to: "up to {high}"
  range_between: "from {low} to {high}"
  range_every: "every zoom"
  renamed: "Renamed {old} to {name}."
  zoom_set: "Zoom range of {name}: {range}."
  deleted: "Deleted {name}."
  delete_title: "Delete bookmark list"
  delete_question_none: "Delete the list {name}?"
  delete_question_one: "Delete the list {name} and its 1 bookmark?"
  delete_question: "Delete the list {name} and its {count} bookmarks?"
  delete_last: "It is the only list, so you will then have a new empty list, Bookmarks."
  delete_ok: "Delete"

# The bookmark list dialog, opened by Open list in the bookmark manager and from the Map menu (P4-T8e; USR-3, DP219
# point 7): one list's bookmarks. Changes take effect at once; Close is the only way out (ACC-7).
bookmark_list_dialog:
  title: "Bookmarks in {name}"
  help: "The bookmarks of this list, in order. Move up and Move down change the order. Choose another list, then Copy to list keeps the bookmark in both, and Move to list takes it out of this one. Delete asks first. Every change takes effect at once. Close when you have finished."
  list: "Bookmarks"
  empty: "This list has no bookmarks."
  up: "Move up"
  down: "Move down"
  target_label: "Other list"
  no_target: "There is no other bookmark list"
  copy: "Copy to list"
  move: "Move to list"
  delete: "Delete"
  copied: "Copied {name} to {list} as {copy}."  # a copy is numbered, as the original keeps its name (Rome_1)
  moved: "Moved {name} to {list}."

# The bookmarks file (P4-T8a, USR-5, DP219): all the bookmark lists in one GeoJSON file.
# Saving and opening bookmark files from the bookmark manager (P4-T9b, P4-T9c; USR-5, DP217, DP219).
bookmark_files:
  # Save to a file: a list to choose from, the chosen list or all lists, as GeoJSON or as GPX; Cancel saves nothing.
  save_title: "Save to a file"
  save_help: "Choose what to save, and as what. GeoJSON opens in QGIS and other map programs, and in TobyMap. GPX gives a waypoint for each bookmark, for GPS programs."
  all_lists: "All lists"
  as_geojson: "{what}, as GeoJSON, for QGIS and other map programs"
  as_gpx: "{what}, as GPX waypoints"
  # The Save box: its title, and its one file type. The suggested file name is the list's name, or this for all lists.
  all_name: "TobyMap bookmarks"
  save_box_geojson: "Save {what} as GeoJSON"
  save_box_gpx: "Save {what} as GPX"
  filter_geojson: "GeoJSON (*.geojson)"
  filter_gpx: "GPX (*.gpx)"
  # Said by the shell once the file is written, or when it could not be.
  saved_geojson: "Saved {what} as GeoJSON."
  saved_gpx: "Saved {what} as GPX waypoints."
  all_saved: "all lists"
  failed: "The file could not be saved."
  # The Open box.
  open_title: "Open a bookmark file"
  open_filter: "Bookmark files (*.geojson *.json *.gpx)"
  # What opening a file did: every list in it is added after yours, a used name numbered (Castles 2).
  opened: "Opened {count} bookmarks into {name}."
  opened_one: "Opened 1 bookmark into {name}."
  opened_empty: "Opened the list {name}, with no bookmarks."
  opened_lists: "Opened {lists} lists with {count} bookmarks: {names}."
  left_out: "{count} routes and tracks were left out, as TobyMap opens only waypoints."
  left_out_one: "1 route or track was left out, as TobyMap opens only waypoints."
  # A list's name when a GPX file has none and the shell gave no file name, and a point or waypoint with no name.
  opened_waypoints: "Opened waypoints"
  unnamed: "Bookmark {number}"
  unnamed_waypoint: "Waypoint {number}"

bookmarks:
  # At start, after the place: the file could not be read. The shell has renamed it, so it is kept.
  damaged: "Your bookmarks file could not be read. It is kept, renamed, and you start with one empty bookmark list, Bookmarks."
  # A file that is not a bookmark file is refused, and nothing changes (USR-5).
  file:
    not_json: "This is not a bookmark file: it is not a JSON file. Nothing is changed."
    not_geojson: "This is not a bookmark file: it is not a GeoJSON feature collection. Nothing is changed."
    not_bookmarks: "This GeoJSON file is not a TobyMap bookmark file. Nothing is changed."
    newer: "This bookmark file was made by a newer TobyMap. Update TobyMap to open it. Nothing is changed."
    damaged: "This bookmark file is damaged, so it cannot be opened. Nothing is changed."
    # Open a file in the bookmark manager (P4-T9b, P4-T9c): the file's content decides whether it is GeoJSON or GPX.
    neither: "This is not a bookmark file: it is neither GeoJSON nor GPX. Nothing is changed."
    no_waypoints: "This GPX file has no waypoints. TobyMap opens only a GPX file's waypoints, not its routes or tracks. Nothing is changed."

# The groups about the current feature (P3-T4, LOC-4). {name} is the current feature.
# Bordering (INF-2): each neighbour, its direction from where you are, and the length of the shared
# border; or, for an area that only nearly touches, the distance across.
bordering:
  # Every item says its distance and direction, as Nearby does (P3-T19c, checklist 6.2). {where} is where its nearest
  # point is, as Overlapping says it (overlapping.where, P3-T32m): "4.5 kilometres north-west", or "you are inside".
  item: "{name}, {where}, shared border {length}"
  # With its share of the whole border, from a pack that has the whole border's length (P3-T24f, DP201).
  item_share: "{name}, {where}, shared border {length}, {share}"
  # The land round a lake or sea, under a heading for each layer, and the seas round land (P3-T24e, DP200).
  shores_heading: "Shores, {layer} {count}"
  shore: "{name}, {where}, {length} of shore"
  # The heading gives the whole coast's length, and its items only the most detailed water (P3-T28b).
  coast_heading: "Coast, {length}"
  coast: "{name}, {where}, {length} of coast"
  # A pack that stores the stretches of coast (P3-T30b) lists them under Coast in place of the waters, west to east,
  # each said like a neighbour: its name, its sea, where its nearest point is, its length and its share of the coast.
  stretch: "{name}, {where}, {length}, {share}"
  stretch_from_to: "Coast from {west} to {east}"
  stretch_both: "Coast with {west} at both ends"
  stretch_from: "Coast from {west}"
  stretch_to: "Coast to {east}"
  stretch_none: "Coast"
  stretch_sea: "{name}, {sea}"
  # A stretch opens to its two ends, west then east.
  stretch_end_meets: "End of the coast, where {other} meets it, {distance} {direction}"
  stretch_end: "End of the coast, {distance} {direction}"
  # The rest of the coast, round islands, with no ends; it opens to the islands with 1 kilometre of coast or more.
  islands: "Coast of islands, {length}, {share}"
  island: "{name}, {where}, {length} round"
  islands_none: "No island here with {length} of coast or more."
  # The ends of a shared border, listed when its item is opened (P3-T24f, DP201).
  end_coast: "End of the border with {name}, at the coast, {sea}, {distance} {direction}"
  end_meets: "End of the border with {name}, where {other} meets it, {distance} {direction}"
  end: "End of the border with {name}, {distance} {direction}"
  ring: "A stretch with no ends, {length} round, nearest point {distance} {direction}"
  no_ends: "No shared border found in the map's shapes."
  near: "{name}, {where}, nearly touches, {across} across"
  # A gap the build stored as 0, under 5 metres: they meet, with under 10 metres of border, not "0 metres across" (P3-T32b).
  touches: "{name}, {where}, touches at a point"
  none: "Nothing borders {name}."
contains:
  heading: "{layer} {count}"
  item: "{name}, {distance} {direction}"
  # An area you are in, said in place of its distance (P3-T29c, INF-4).
  inside: "{name}, you are inside"
  # A line or a place whose nearest point is where you are (under HERE_M), not "0 metres" (P3-T29c).
  here: "{name}, here"
  # A feature only partly inside another, as Browse by category lists it (P3-T25b, DP204).
  partly_name: "{name}, partly in {holder}"
  none: "Nothing visible inside {name}."
# A share said as a percentage, in Overlapping and Bordering ({share}, {mine} and {theirs} there): whole percents,
# and "less than 1 percent" for a share under 1 percent, as a line's is (P3-T32a).
share:
  percent: "{share} percent"
  little: "less than 1 percent"
overlapping:
  # Overlapping (INF-5, INF-6, P3-T29e). {where} is where the item's nearest point is: "you are inside" for an area
  # you are in, "here" for a line you are on, else its distance and direction, "4.5 kilometres north-west".
  where: "{distance} {direction}"
  where_inside: "you are inside"
  where_here: "here"
  # For an area: the areas of other layers that cover part of it, under a heading for each layer (contains.heading).
  item: "{name}, {where}, {mine} of {current} and {theirs} of {name} overlap"
  # Then the lines partly inside it, said with how many times each crosses the border and the nearest crossing;
  # opened, each crossing point (P3-T24f, DP201). crosses is for a line with no crossing stored.
  crossing_heading: "Lines crossing its border {count}"
  crosses_border: "{name}, crosses {times}, nearest {distance} {direction}"
  times_1: "once"
  times_2: "twice"
  times_n: "{count} times"
  point: "Crossing {number} of {name}, {distance} {direction}"
  # A line that crosses once: its one crossing, without a number (P3-T32k).
  point_one: "Crossing of {name}, {distance} {direction}"
  crosses: "{name}, {where}, crosses it"
  # Then the lines that run along its border, such as the Rhine for Switzerland.
  along_heading: "Lines along its border {count}"
  along: "{name}, {where}, along its border"
  # For a line: the areas it passes through, in order from its start, each with its share of the line.
  partly: "{name}, {where}, {share} of {current} is inside it"
  partly_little: "{name}, {where}, less than 1 percent of {current} is inside it"
  order_from_start: "from its start"
  none: "Nothing overlaps {name}."
search:
  none: "No search yet."
  # A search result (P3-T8b, SRB-1): the description that tells it apart, such as "Paris, Île-de-France,
  # France", then what it is, as Details says it. Found by a name other than the English: "found as" it.
  result: "{description}, {type}"
  result_via: "{description}, {type}, found as {via}"
  # Results that would be said with the same words get their distance and direction from where you are (P3-T32j).
  result_apart: "{label}, {distance} {direction}"
  nothing: "Nothing found for {text}."
  # Typing one of these words lists the disputed or unclaimed areas first (P3-T16a).
  word_disputed: "disputed"
  word_unclaimed: "unclaimed"
  # The search dialog (P3-T8c) and its choice of where to search (P3-T8d, SRB-2).
  title: "Search"
  label: "Search for"
  help: "Type a name. The results appear below; press Down to reach them and Enter to go there."
  results_label: "Results"
  scope_label: "Search in"
  scope_all: "Everywhere"
  scope_inside: "Inside {name}"
  scope_near: "Near here, within {distance}"
  scope_layer: "Only {layer}"
  go_button: "Go"
  # An item of the Search group: {where} is its direction, or "here" for a place or line you are at, or "you are
  # inside" for an area you are in, as Overlapping says them (overlapping.where_here, where_inside, P3-T32l).
  item: "{description}, {where}"
  gone: "{description}"

# The world tree (P3-T9a, SRB-3) and browsing by category (P3-T9b, SRB-4).
tree:
  title: "World tree"
  help: "Use the arrow keys to move round the tree: Right opens an item and Left closes it. Enter goes to the item."
  world: "World"
  item: "{name}, {type}"
  go_button: "Go"
  gone: "{name}"
  leaf: "{name} has no areas below it in the tree."
  world_go: "The World is the top of the tree. Choose a continent, country or area to go there."
  # Land that is not plainly one country's (P3-T16a, ANN-6, DAT-8): each item gives its claimants, or none.
  disputed: "Disputed areas"
  unclaimed: "Unclaimed areas"
  special_go: "{name} is a list, not a place. Open it and choose an area to go there."
  special_none: "No {kind} are stored."
  special_claimed: "{name}, {type}, claimed by {claimants}"
  special_view: "{name}, {type}, {view}"
  special_unclaimed: "{name}, {type}, no claimant"
  # A dispute, which opens to its areas (P3-T26a, DP205).
  dispute: "{name}, {count} areas"
  dispute_claimed: "{name}, claimed by {claimants}, {count} areas"
  dispute_view: "{name}, {view} {count} areas"
browse:
  title: "Inside {name}"
  help: "Choose a kind of feature to list every one inside {name}, or Cancel to stay."
  none_here: "No feature to look inside. Search for one, or go to one first."
  nothing_inside: "No features are stored inside {name}."
  done: "{layer}: {count} inside {name}, in the Search group."
  done_capped: "{layer}: {count} inside {name}. The first {limit} are in the Search group."

# The query builder (P3-T10a, INF-9): find a layer, how it relates, and to which feature. The answer goes
# into the Search group, under a heading such as "Rivers crossing Germany, 1 item". No field names appear.
query:
  title: "Query"
  help: "Choose what to find, how it relates, and the feature, then OK. The answer goes into the Search group."
  find_label: "Find"
  relation_label: "Relation"
  of_label: "Of"
  distance_label_km: "Distance in kilometres"
  distance_label_mi: "Distance in miles"
  relation_inside: "inside"
  relation_crossing: "crossing"
  relation_bordering: "bordering"
  relation_near: "within a distance of"
  of_current: "{name}, the current feature"
  of_found: "{description}, from the Search group"
  # The Search group's heading, and the answer said: "Rivers crossing Germany".
  heading_inside: "{layer} inside {name}"
  heading_crossing: "{layer} crossing {name}"
  heading_crossed_by: "{layer} crossed by {name}"
  heading_bordering: "{layer} bordering {name}"
  heading_near: "{layer} within {distance} of {name}"
  # An item of an answer within a distance: "Newport, 6.4 kilometres from Hampshire"; one inside it, its name.
  item_near: "{name}, {distance} from {of}"
  done: "{heading}: {count}, in the Search group."
  done_capped: "{heading}: {count}. The first {limit} are in the Search group."
  nothing: "No {heading}."
  of_search: "Search for a feature"
  bad_distance: "Type a distance greater than 0, such as 10."
  bad_choice: "Choose what to find, the relation and the feature."

# Hierarchy mode (P3-T6a; NAV-4, NAV-11, DP77). M switches it on and off; the arrow keys go up, down and
# round the neighbours. A move says the feature, then the zoom it was fitted to: "England. Zoom 250 kilometres."
# A neighbour is said as Bordering says it: "Spain, south-west, shared border 452 kilometres. Zoom ..."
hierarchy:
  "on": "Hierarchy mode. {name}."
  on_nothing: "Hierarchy mode. No area here."
  stepping: "Stepping mode."
  round: "Left and Right now go round {name}."
  moved: "{text}. {zoom}"
  top: "Nothing holds {name}."
  # The ambiguous up: the feature is inside two areas, neither inside the other (NAV-4).
  up_title: "Up from {name}"
  up_help: "{name} is inside more than one area, and neither is inside the other. Choose one to go up to, or Cancel to stay."
  choice: "{name}, {type}"
  # Down: the kinds of visible feature inside, each with its count, then a kind's features (INF-4).
  down_title: "Inside {name}"
  down_help: "Choose a kind of feature, or Cancel to stay."
  # A kind of which the size rule leaves some out at this zoom, with how many are inside in all (P3-T25a, DP204).
  down_line: "{layer}: {count} shown at this zoom, {total} in all"
  kind_title: "{kind} in {name}"
  kind_help: "Choose a feature to go to it, or Cancel to stay."
  # Left and Right: a neighbour as you approved in DP190, without the distance the Bordering group now says.
  # {direction} is that of its nearest point, as Bordering's, or "you are inside" (overlapping.where_inside, P3-T32m).
  across: "{name}, {direction}, shared border {length}"
  across_near: "{name}, {direction}, nearly touches, {across} across"
  across_touches: "{name}, {direction}, touches at a point"

# Which unit system, bearing style and coordinate format is chosen (ANN-5, LOC-1).
# Why a pack was not opened, or what is wrong with it (PCK-5, NFR-4, P1-T2).
# {name} is the pack's file name.
packs:
  downloading_first: "Downloading the map for the first time. It is kept in this browser, so this happens once."
  downloading: "Downloading the map: {percent} percent."
  download_done: "The map is downloaded."
  none_installed: "No map pack is installed, so TobyMap has no map to show. Open Help, then About the data, for how to get one."
  not_a_pack: "{name} is not a TobyMap pack, so it was not opened."
  newer_format: "{name} needs a newer version of TobyMap, so it was not opened. Update TobyMap to use it."
  app_too_old: "{name} needs TobyMap {need} or later, and this is TobyMap {have}, so it was not opened. Update TobyMap to use it."
  app_too_new: "{name} was made for versions of TobyMap before {before}, and this is TobyMap {have}, so it was not opened. Download the current pack instead."
  damaged_pack: "{name} is damaged, so it was not opened. Download it again. The damage is in its {record}."
  damaged_record: "Part of {name} is damaged, and TobyMap is carrying on without it. Download the pack again. The damaged record is {record}."
  set_aside: "{message} It has been moved out of use, and TobyMap is carrying on with the other packs."
  checksum_wrong: "{name} does not match its checksum, so it may be damaged or incomplete. Download it again."
  # The catalogue of packs that can be downloaded (P4-T6a). {name} is a pack, {field} the part of its entry that is wrong.
  catalogue_unreadable: "The list of packs that can be downloaded could not be read, so no pack is offered. Try again later."
  catalogue_newer: "The list of packs that can be downloaded is for a newer version of TobyMap. Update TobyMap to see it."
  catalogue_field: "The list of packs that can be downloaded is wrong for {name}: its {field} is missing or not valid."
  catalogue_twice: "The list of packs that can be downloaded names {name} more than once."
  state_installed: "installed"
  state_not_installed: "not installed"
  state_update: "update available"
  # Installing a pack from the catalogue (P4-T6b, PCK-5). {name} is the pack's title, or its name when it has none.
  install_progress: "Downloading {name}: {percent} percent."
  install_done: "{name} is downloaded and open."
  install_too_old: "{name} needs TobyMap {need} or later, and this is TobyMap {have}, so it was not downloaded. Update TobyMap to use it."
  install_too_new: "{name} was made for versions of TobyMap before {before}, and this is TobyMap {have}, so it was not downloaded."
  install_damaged: "{name} did not match its checksum after downloading, so it may be damaged or incomplete. It has been removed. Download it again."
  install_failed: "{name} could not be downloaded, so nothing was changed. Check the connection and try again."
  install_busy: "{name} is still downloading. Wait for it to finish, then try again."


