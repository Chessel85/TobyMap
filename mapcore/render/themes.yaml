# Map themes (VIS-2, P2-T12a). The settings' Display tab chooses one; T and Shift+T go
# through them in this order. high_contrast: true holds the theme to the 7 to 1 contrast
# check of every outline and text colour against what it is drawn on (VIS-2,
# mapcore/render/themes.py), whatever the map display setting chooses (DP108).
#
# Land colours are indexed by the area's colour number, 1 to 7, so that neighbours
# differ (AD-19). Names are drawn in name_text on a halo of name_halo (P2-T12d).
# A colour "#00000000" is fully transparent.
standard:
  label: Standard
  high_contrast: false
  background: "#1b1f24"      # around the globe
  ocean: "#a9cce3"
  light_water: "#cfe3f0"    # territorial waters, a lighter blue than the open sea (P4-T12b, DAT-15)
  globe_edge: "#3c5a73"
  land:
    - "#e8d8a9"
    - "#c9e2b3"
    - "#f2c6b4"
    - "#d6c8e6"
    - "#f6e3a1"
    - "#b9dcd2"
    - "#e5c1d3"
  border: "#5a4a3a"
  border_width: 1
  current_outline: "#b00020"   # the country under the centre (UX 11.2)
  current_width: 3
  highlight_fill: "#ffd200"    # the item selected in the Information panel
  highlight_outline: "#000000"
  cross: "#000000"
  cross_halo: "#ffffff"
  line: "#2e4a62"              # line features, such as the graticule (P2-T10a)
  line_width: 1
  special_line: "#6a1b9a"         # the equator, prime meridian, tropics, polar circles and date line (P2-T17v)
  special_line_width: 2.5
  marker: "#7a1f1f"            # point features, such as a railway station
  marker_outline: "#ffffff"
  marker_radius: 4
  bookmark: "#283593"   # a bookmark's diamond, indigo, outlined in white (P4-T8f, DP219 point 5)
  bookmark_outline: "#ffffff"
  name_text: "#1b1f24"
  name_halo: "#ffffff"
  country_border_width: 2.5   # the country borders, thicker than the others (P3-T23, DP198)
  current_tint_alpha: 0.25     # the current feature is filled with its outline colour, this opaque (P3-T23)
  plain_land: "#ece4cc"        # the land in the physical view, under the physical features
  physical:                    # the physical view's colour for each kind of area
    islands: "#c9dfa8"
    mountain-ranges: "#cfae86"
    physical-regions: "#e6d59c"
    default: "#d9d2bd"
    land-use: "#ddd8c4"          # a regional pack's land use, parks and school grounds (P4-T1i)
    parks: "#bfe0a8"
    school-grounds: "#ecd3b0"

# Dark land, white borders, yellow for the current area; every outline and text 7 to 1.
high_contrast_dark:
  label: High contrast dark
  high_contrast: true
  background: "#000000"
  ocean: "#000000"
  light_water: "#0a2540"    # territorial waters: lighter than the black sea, every outline still 7 to 1
  globe_edge: "#ffffff"
  land:
    - "#4d3300"
    - "#004d26"
    - "#3d1466"
    - "#661414"
    - "#004d5c"
    - "#404040"
    - "#1a2e80"
  border: "#ffffff"
  border_width: 1.5
  current_outline: "#ffff00"
  current_width: 4
  highlight_fill: "#ffffff"
  highlight_outline: "#000000"
  cross: "#ffffff"
  cross_halo: "#000000"
  line: "#00ffff"
  line_width: 1.5
  special_line: "#66ff66"
  special_line_width: 3
  marker: "#ffffff"
  marker_outline: "#000000"
  marker_radius: 5
  bookmark: "#ffd0ff"   # pale pink, outlined in black
  bookmark_outline: "#000000"
  name_text: "#ffffff"
  name_halo: "#000000"
  country_border_width: 3
  current_tint_alpha: 0.3
  plain_land: "#333333"
  physical:
    islands: "#1f4d1f"
    mountain-ranges: "#5c3d1f"
    physical-regions: "#3d3d14"
    default: "#3a3a3a"
    land-use: "#2e2e2e"          # a regional pack's land use, parks and school grounds (P4-T1i)
    parks: "#1a4a1a"
    school-grounds: "#4a3a10"

# Pale land, black borders, dark blue for the current area; every outline and text 7 to 1.
high_contrast_light:
  label: High contrast light
  high_contrast: true
  background: "#ffffff"
  ocean: "#ffffff"
  light_water: "#d6ebff"    # territorial waters: the sea is white, so a pale blue, every outline still 7 to 1
  globe_edge: "#000000"
  land:
    - "#fff3a0"
    - "#ffd0e0"
    - "#c8f5d0"
    - "#e0d8ff"
    - "#ffd8b0"
    - "#c8ecff"
    - "#e6e6e6"
  border: "#000000"
  border_width: 1.5
  current_outline: "#00008b"
  current_width: 4
  highlight_fill: "#000000"
  highlight_outline: "#ffff00"
  cross: "#000000"
  cross_halo: "#ffffff"
  line: "#003300"
  line_width: 1.5
  special_line: "#8b0000"
  special_line_width: 3
  marker: "#000000"
  marker_outline: "#ffffff"
  marker_radius: 5
  bookmark: "#7a0060"   # dark magenta, outlined in white
  bookmark_outline: "#ffffff"
  name_text: "#000000"
  name_halo: "#ffffff"
  country_border_width: 3
  current_tint_alpha: 0.3
  plain_land: "#f2f2f2"
  physical:
    islands: "#d6f5d6"
    mountain-ranges: "#f5d6b3"
    physical-regions: "#fff0b3"
    default: "#e6e6e6"
    land-use: "#e0e0e0"          # a regional pack's land use, parks and school grounds (P4-T1i)
    parks: "#c8ecc8"
    school-grounds: "#fde6c0"

# Seven colours after the Okabe and Ito palette, lightened for filling, that still differ
# for each of the three common kinds of colour blindness (tested by simulation), with
# black borders a little thicker than the standard theme's.
colour_blind_safe:
  label: Colour-blind safe
  high_contrast: false
  background: "#1b1f24"
  ocean: "#e8eef2"
  light_water: "#f6f9fb"    # territorial waters, a lighter blue than the open sea
  globe_edge: "#000000"
  land:
    - "#f5c26b"
    - "#9fd3f2"
    - "#66c2a5"
    - "#f7ef99"
    - "#4a90c8"
    - "#e8865a"
    - "#d9a5c4"
  border: "#000000"
  border_width: 1.5
  current_outline: "#000000"
  current_width: 4
  highlight_fill: "#ffffff"
  highlight_outline: "#000000"
  cross: "#000000"
  cross_halo: "#ffffff"
  line: "#000000"
  line_width: 1
  special_line: "#5b1f8a"
  special_line_width: 3
  marker: "#000000"
  marker_outline: "#ffffff"
  marker_radius: 4
  bookmark: "#1a1a80"   # dark blue, outlined in white
  bookmark_outline: "#ffffff"
  name_text: "#000000"
  name_halo: "#ffffff"
  country_border_width: 3
  current_tint_alpha: 0.25
  plain_land: "#efe7d4"
  physical:
    islands: "#66c2a5"
    mountain-ranges: "#d9a066"
    physical-regions: "#f7ef99"
    default: "#e0e0e0"
    land-use: "#e6e1cf"          # a regional pack's land use, parks and school grounds (P4-T1i)
    parks: "#b5dcb0"
    school-grounds: "#f0d3a8"

# The colours the map display setting can choose for the fill, the borders and the
# current outline (DP108). Their names are in the settings' choices.
palette:
  black: "#000000"
  white: "#ffffff"
  yellow: "#ffff00"
  orange: "#ff8c00"
  red: "#d00000"
  magenta: "#ff00ff"
  blue: "#0050ff"
  dark_blue: "#00008b"
  cyan: "#00ffff"
  green: "#008000"
  grey: "#808080"
  light_grey: "#d3d3d3"
