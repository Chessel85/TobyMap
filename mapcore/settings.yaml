# The settings dialog, as data (P1-T8, P1-T10). The core owns what is in it, so
# the desktop and the web version show the same settings. Each field has an id,
# a label, a kind (choice, number or yes_no), its default and, for a choice, its
# choices as [value, label]. The words are the dialog's own (architecture 3.4).

tabs:
  - id: units
    label: Units
    fields:
      - id: units
        label: Distances
        kind: choice
        default: metric
        choices: [[metric, Metric], [imperial, Imperial], [nautical, "Nautical miles at sea"]]
      - id: bearing
        label: Directions
        kind: choice
        default: points8
        choices:
          - [exact, Exact degrees]
          - [round5, Degrees rounded to 5]
          - [round10, Degrees rounded to 10]
          - [clock, Clock face]
          - [points4, Compass with 4 points]
          - [points8, Compass with 8 points]
          - [points16, Compass with 16 points]
          - [points32, Compass with 32 points]
      - id: coordinates
        label: Coordinates
        kind: choice
        default: decimal
        choices: [[decimal, Decimal degrees], [dms, "Degrees, minutes and seconds"]]
      - id: coordinate_places
        label: Decimal places in coordinates
        kind: choice
        default: step
        choices: [[step, "Fit the step size"], [fixed, "Always 5, or a tenth of a second"]]
  - id: movement
    label: Movement
    fields:
      - id: link
        label: Link step to zoom
        kind: yes_no
        default: false
      - id: repeat_delay_ms
        label: "Holding an arrow key: wait before repeating, in milliseconds"
        kind: number
        default: 500
        min: 100
        max: 2000
      - id: repeat_rate
        label: "Holding an arrow key: steps a second"
        kind: number
        default: 6
        min: 1
        max: 30
      - id: held_draw_rate
        label: "Holding an arrow key: map drawings a second"
        kind: number
        default: 4
        min: 1
        max: 30
      - id: turn_deg
        label: "Free facing: degrees turned by Left and Right"
        kind: number
        default: 5
        min: 1
        max: 90
      - id: large_turn_deg
        label: "Free facing: degrees turned by Shift with Left and Right"
        kind: number
        default: 90
        min: 1
        max: 180
      - id: fine_turn_deg
        label: "Free facing: degrees turned by Ctrl with Left and Right"
        kind: number
        default: 1
        min: 1
        max: 45
      # The places Alt+Comma and Alt+Full stop go back and forward through (NAV-10, DP142).
      - id: places_clear_on_start
        label: Clear the places on start
        kind: yes_no
        default: false
      - id: nearby_count
        label: Number of nearby items
        kind: number
        default: 8
        min: 1
        max: 30
      - id: passed_nearby
        label: "Crossed and passed: the passed nearby distance"
        kind: choice
        default: percent
        choices: [[percent, "A share of the step"], [fixed, "A fixed distance"]]
      - id: passed_percent
        label: "Crossed and passed: share of the step, in percent"
        kind: number
        default: 10
        min: 1
        max: 100
      - id: passed_fixed_m
        label: "Crossed and passed: fixed distance, in metres"
        kind: number
        default: 500
        min: 1
        max: 100000
  # How much is said by itself (P2-T11; ACC-5, DP144). The preset sets the four switches
  # after it; changing a switch makes the preset Custom. The presets are under "presets"
  # at the end of this file. The tick has its switch in the Earcons tab.
  - id: speech
    label: Speech
    fields:
      - id: verbosity
        label: "How much is said: the preset"
        kind: choice
        default: normal
        choices:
          - [terse, "Terse: only the smallest area that changed"]
          - [normal, "Normal: every area that changed, the zoom, the step and the heading"]
          - [detailed, "Detailed: the whole place when an area changes, and the heading after each step in free facing"]
          - [custom, "Custom: your own choice of the switches below"]
      - id: say_area
        label: After a step
        kind: choice
        default: changed
        choices:
          - [smallest, "Say only the smallest area that changed"]
          - [changed, "Say every area that changed"]
          - [whole, "Say the whole place when an area changed"]
          - ["off", "Say nothing, only the tick"]
      - id: say_zoom_step
        label: Say the zoom and the step when they change
        kind: yes_no
        default: true
      - id: say_heading
        label: Say the heading after a turn
        kind: yes_no
        default: true
      - id: say_heading_on_step
        label: "Free facing: say the heading after every step"
        kind: yes_no
        default: false
  - id: layers
    label: Layers
    fields:
      - id: graticule_interval
        label: Degrees between lines of latitude and longitude
        kind: choice
        default: "10"
        choices:
          - ["1", "1 degree"]
          - ["5", "5 degrees"]
          - ["10", "10 degrees"]
          - ["15", "15 degrees"]
          - ["30", "30 degrees"]
  - id: sound
    label: Sound
    fields:
      - id: mute
        label: Mute all of TobyMap's sound
        kind: yes_no
        default: false
      - id: sound_mode
        label: Sound in space
        kind: choice
        default: stereo
        choices: [[stereo, "Stereo, with a lower pitch behind"], [hrtf, "HRTF for headphones, with a lower pitch behind"]]
      - id: sound_curve
        label: How loudness falls with distance
        kind: choice
        default: linear
        choices: [[linear, "Evenly, to the edge of the view"], [log, "Equally quieter for each doubling of distance"]]
      - id: min_volume
        label: "Minimum volume, in percent: no sound is quieter"
        kind: number
        default: 20
        min: 0
        max: 100
      - id: beyond_view
        label: Sounds beyond the view
        kind: choice
        default: quiet
        choices: [[quiet, "At the minimum volume, muffled"], [tone, "A fixed tone"]]
      - id: voice_volume
        label: "Spatial voice: volume, in percent"
        kind: number
        default: 100
        min: 0
        max: 100
      - id: voice_rate
        label: "Spatial voice: speed, in percent"
        kind: number
        default: 100
        min: 50
        max: 500   # PO note on checklist 9.7
      - id: voice_also_speak
        label: Also speak spatial labels through the screen reader
        kind: yes_no
        default: false
      # The orientation beacon (P2-T9, SON-10). B switches it too. Pins join the target in Phase 4.
      - id: beacon_on
        label: Orientation beacon on
        kind: yes_no
        default: false
      - id: beacon_volume
        label: "Orientation beacon: volume, in percent"
        kind: number
        default: 100
        min: 0
        max: 100
      - id: beacon_interval_s
        label: "Orientation beacon: seconds between each sound"
        kind: number
        default: 1
        min: 0.5
        max: 5
      - id: beacon_target
        label: "Orientation beacon: comes from"
        kind: choice
        default: north_pole
        choices: [[north_pole, The North Pole]]
  # The earcons (P2-T8; SON-6, SON-8): the volume, then for every earcon in
  # mapcore/describe/earcons.yaml a switch, earcon_on_<event>, and your own file,
  # earcon_<event>, made by mapcore/settings.py from the two labels below.
  - id: earcons
    label: Earcons
    fields:
      - id: earcon_volume
        label: "Earcons: volume, in percent"
        kind: number
        default: 100
        min: 0
        max: 100
    each_earcon:
      on_label: "{name}: play it"
      file_label: "{name}: your own sound file"
  - id: display
    label: Display
    fields:
      # Themes and the map display setting (P2-T12; VIS-2, VIS-3, VIS-5, DP108). T and Shift+T
      # also change the theme. In a high contrast theme a colour below 7 to 1 is not used.
      - id: theme
        label: Theme
        kind: choice
        default: standard
        choices:
          - [standard, Standard]
          - [high_contrast_dark, High contrast dark]
          - [high_contrast_light, High contrast light]
          - [colour_blind_safe, Colour-blind safe]
      - id: map_fill
        label: Fill of the areas
        kind: choice
        default: neighbours
        choices:
          - [neighbours, "Different colours for neighbours"]
          - [one, "One colour for all"]
          - [none, "None: outlines only"]
      - id: map_borders
        label: Draw the borders
        kind: yes_no
        default: true
      - id: fill_colour
        label: "Colour of the fill, when it is one colour for all"
        kind: choice
        default: theme
        choices:
          - [theme, "The theme's own"]
          - [black, Black]
          - [white, White]
          - [yellow, Yellow]
          - [orange, Orange]
          - [red, Red]
          - [magenta, Magenta]
          - [blue, Blue]
          - [dark_blue, Dark blue]
          - [cyan, Cyan]
          - [green, Green]
          - [grey, Grey]
          - [light_grey, Light grey]
      - id: border_colour
        label: Colour of the borders
        kind: choice
        default: theme
        choices:
          - [theme, "The theme's own"]
          - [black, Black]
          - [white, White]
          - [yellow, Yellow]
          - [orange, Orange]
          - [red, Red]
          - [magenta, Magenta]
          - [blue, Blue]
          - [dark_blue, Dark blue]
          - [cyan, Cyan]
          - [green, Green]
          - [grey, Grey]
          - [light_grey, Light grey]
      - id: outline_colour
        label: Colour of the outline of the current area
        kind: choice
        default: theme
        choices:
          - [theme, "The theme's own"]
          - [black, Black]
          - [white, White]
          - [yellow, Yellow]
          - [orange, Orange]
          - [red, Red]
          - [magenta, Magenta]
          - [blue, Blue]
          - [dark_blue, Dark blue]
          - [cyan, Cyan]
          - [green, Green]
          - [grey, Grey]
          - [light_grey, Light grey]
      - id: map_names
        label: Show names on the map
        kind: yes_no
        default: true
      - id: label_size
        label: "Size of the names, in percent"
        kind: number
        default: 100
        min: 50
        max: 300
      - id: heading_up
        label: "Cardinal and free facing: turn the map so the way you face is up"
        kind: yes_no
        default: false
      - id: centre_cross
        label: Show the cross at the centre of the map
        kind: yes_no
        default: true
      - id: hover_announce
        label: Announce places when the mouse moves over the map
        kind: yes_no
        default: false

# The verbosity presets (P2-T11; ACC-5, DP144): the switches each one sets. Custom sets
# none; it is what the preset says when the switches match no preset.
presets:
  terse: {say_area: smallest, say_zoom_step: false, say_heading: false, say_heading_on_step: false}
  normal: {say_area: changed, say_zoom_step: true, say_heading: true, say_heading_on_step: false}
  detailed: {say_area: whole, say_zoom_step: true, say_heading: true, say_heading_on_step: true}
