# The continents (P3-T1e, DAT-12, DP174, DP88). The reference is docs/data-manager/configuration.md.
#
# Seven continents, as you agreed in DP174, with Cyprus in Europe. Each continent has an area that
# says roughly where it is. The continents stage uses these areas in two ways:
#
# * A country goes whole to one continent: the one whose area holds most of the land of the country's
#   main group of parts. A group of its parts more than distant_km from the rest, such as the Canary
#   Islands or Hawaii, goes to the continent whose area holds most of it: "by where they are" (DP88).
# * A country in "split", such as Russia, is cut along the edges of the areas, so for these the edges
#   are the dividing lines, drawn with care: the Urals, the Ural River (from Natural Earth's rivers),
#   the Caspian, the main ridge of the Greater Caucasus, the Bosphorus and Dardanelles, the Suez Canal,
#   and the sea between New Guinea and the rest of Indonesia. Elsewhere the edges run through the sea
#   and only need to be on the right side of each island.
#
# The areas are taken in order, and a place in two belongs to the first. Where no area holds a place,
# it belongs to the continent with rest: true. Longitudes may run past 180 or -180, for an area that
# crosses the 180 degree line; the stage folds them back.

distant_km: 300
# A part cut off a split country that is smaller than this, in km2, stays with the rest: a sliver
# where a dividing line runs a little off the coast.
split_min_km2: 100

split:
  - {wikidata: Q159, name: Russia}       # the Urals and the Ural River, the Caucasus, and the Bering Strait
  - {wikidata: Q232, name: Kazakhstan}   # the Ural River
  - {wikidata: Q43, name: Turkey}        # the Bosphorus and the Dardanelles
  - {wikidata: Q79, name: Egypt}         # the Suez Canal
  - {wikidata: Q230, name: Georgia}      # the main ridge of the Greater Caucasus
  - {wikidata: Q227, name: Azerbaijan}   # the main ridge of the Greater Caucasus
  - {wikidata: Q252, name: Indonesia}    # its part of New Guinea is in Oceania

