# The graticule layers (P2-T10b, DAT-13, SCP-7, AD-11): lines of latitude and longitude,
# and the special lines. Both are lines, off at first, and never part of "where am I".
# The reference for each setting is docs/data-manager/configuration.md.

layers:
  - {id: graticule, name: Lines of latitude and longitude, rank: 8, kind: land, group: Graticule, geometry: line, switched_on: false, crossing_earcon: line_crossing}
  # The special lines are drawn thicker and in a colour of their own (line_style: special, P2-T17v).
  # The meridians and the circles of latitude each have a sound of their own; the date line keeps the layer's.
  - {id: special-lines, name: "Special lines: equator, prime meridian, tropics, polar circles and date line", rank: 8, kind: land, group: Graticule, geometry: line, switched_on: false, crossing_earcon: line_crossing, line_style: special,
     crossing_earcons: {prime-meridian: meridian_crossed, antimeridian: meridian_crossed, equator: equator_crossed, tropic: equator_crossed, polar-circle: equator_crossed}}
