# The sample layers (P2-T10c): a railway station, for the test pack only. It is for the
# tests of Crossed and passed (ANN-2). The sample river and lake are in the base layers'
# rivers and lakes since P3-T1g and P3-T1h. The world pack's railways are lines, in the base
# layers since P3-T1i, and it does not use this file. The reference for each setting is docs/data-manager/configuration.md.

layers:
  - {id: stations, name: Railway stations, rank: 8, kind: land, group: Transport, geometry: point, switched_on: true}
  # The New Forest National Park, which overlaps Hampshire and Wiltshire, for the tests of the relationships only:
  # INF-5's overlaps and NAV-4's ambiguous up (P3-T3). National parks come to the real packs in Phase 4. Its area
  # overlaps the counties, so it is not painted.
  - {id: national_parks, name: National parks, rank: 6, kind: land, group: Boundaries, geometry: area, switched_on: true, fill: none}
