# The regional test pack (P4-T1, design docs/plan/p4-t1-design.md sections 3.3 and 5.4): a small regional pack,
# built from the samples in the repository, so the tests never need the data folder. Its coverage is the three
# sample boxes of tests/samples/osm-raw (Winchester, Brockenhurst and Lymington), each a whole number of pack tiles
# at tile level 14. Its stages are great-britain.yaml's, in the same order, with the samples stage in place of
# osm-areas, squares and join, and the raw samples (sample-osm-raw) in place of the planet file. The stages
# osm-layer, osm-rivers and osm-lines cannot read the raw samples, so they are left out. The tests open it with the
# test pack (tests/conftest.py, test_region_pack). The reference for each setting is
# docs/data-manager/configuration.md.

name: test-region
title: The regional test pack, three small areas of Hampshire from the samples in the repository.
version: 0.1.0
app_versions: {from: 0.0.1}
coverage: {kind: region, draw_below_km: 250}
layer_groups: [base, regional]
space_needed_mb: 50

stages:
  # The test pack's own area samples, least detailed first, and the land of the Lymington box at about 1 metre.
  - stage: samples
    samples:
      - {source: sample-world}
      - {source: sample-oceans}
      - {source: sample-osm, file: england-france-channel.geojson}
      - {source: sample-osm, file: hampshire-wiltshire.geojson}
      - {source: sample-osm, file: isle-of-wight-solent.geojson}
      - {source: sample-osm, file: lymington-coast.geojson}
  - stage: water
    land_layer: countries
  # The coverage: the pack tiles at tile level 14 that hold land inside the test region's outline, which are exactly
  # the sample boxes' pack tiles.
  - stage: coverage
    sources: [sample-outline]
    tile_level: 14
    merge_from_level: 6
  # Every administrative level below the counties, by the local levels record (mapdata/config/local_levels.yaml):
  # districts and parishes, cut to the counties' land, slivers to the neighbour, land in no parish as one area for
  # each district, simplified on shared edges at the counties' detail (P4-T1b).
  - stage: local-areas
    source: sample-osm-raw
    tolerance_m: 10
    sliver_km2: 0.1
    sliver_width_m: 200
  # Every island under 1 km2 that the stage before has not named, as "Unnamed island" or by OpenStreetMap's island
  # point on it (P4-T1c).
  - stage: small-islands
  # Every other lake, pond, reservoir and basin, of any size, into the lakes; unnamed ones by their type's words
  # ("Pond", "Unnamed lake"); a river's area left out (P4-T1c).
  - stage: osm-water
    source: sample-osm-raw
    tolerance_m: 5
    leave_out: [river]
  # osm-waterways: added by P4-T1g
  # osm-streets: added by P4-T1d
  # osm-land: added by P4-T1e
  # osm-pois: added by P4-T1f
  # osm-places (villages): added by P4-T1f
  # match: added by P4-T1h
  - stage: relationships
    # relationships light_layers and crossing_areas: set by P4-T1k
  - stage: coast-stretches
  - stage: corrections
    file: tests/samples/corrections.yaml
  - stage: write
    # write drawing_levels: set by P4-T1i
