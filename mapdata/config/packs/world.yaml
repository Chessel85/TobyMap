# The base pack lite: the whole world (P1-T4, DP112). Countries, first-level
# divisions, and oceans and seas, cut to the real coast, with no gaps (LOC-6).
# The base detail is 100 metres, as the PO chose on 3 November (DP112).
# The reference for each setting is docs/data-manager/configuration.md.

name: world
title: "Base pack lite: countries, first-level divisions, and oceans and seas, for the whole world."
version: 0.1.0
app_versions: {from: 0.0.1}
coverage: {kind: world}
layer_groups: [base, graticule]
space_needed_mb: 40000

stages:
  - stage: osm-areas
    source: planet
    levels: [3, 4, 5]
    # The county areas too, a country at a time, at each country's levels in the counties record (P3-T1c, DP175).
    counties: true
    # Named islands and islets too, as areas, with a point for those mapped as a point (P3-T1d).
    islands: true
  - stage: squares
    sources: [land-polygons, vliz-oceans]
    # Named seas, bays and straits below the oceans (P3-T1b, DP168).
    seas: naturalearth-marine-areas
    tolerance_m: 100
    # The counties layer, by the rule of DP101: level 6, gaps filled by 7 then 8, then the region itself.
    counties: true
    condominiums:
      - {id: "condominium:de-lu", name: Moselle condominium, countries: [osm:r51477, osm:r2171347]}
  - stage: join
    unclaimed:
      - {name: Bir Tawil, point: [33.75, 21.87], note: "Land between Egypt and Sudan that neither country claims."}
      # More than one party claims these, so they are disputed, not unclaimed (DP120).
      - {name: West Bank, point: [35.29, 31.68], disputed: true, note: "Land that Israel and Palestine both claim."}
      - {name: Ilemi Triangle, point: [35.22, 4.81], disputed: true, note: "Land that South Sudan and Kenya both claim; Ethiopia has also claimed part of it."}
    named_waters:
      - {id: "water:caspian-sea", name: Caspian Sea, point: [50.5, 41.5]}
  - stage: osm-places
    source: planet
    # Named seas, bays and straits that Natural Earth's marine areas do not name, as places (P3-T1b, DP168).
    layer: sea-places
    same_as: seas
    queries:
      - {query: "n[place=sea][name]", type: sea}
      - {query: "a[place=sea][name]", type: sea}
      - {query: "n[natural=bay][name]", type: bay}
      - {query: "a[natural=bay][name]", type: bay}
      - {query: "n[natural=strait][name]", type: strait}
      - {query: "a[natural=strait][name]", type: strait}
  - stage: graticule
    # The tropics and polar circles are worked out for this year (the tilt of the Earth's axis changes slowly).
    year: 2026
    source: naturalearth-geographic-lines
  # The continents, from the countries, split along the lines in mapdata/config/continents.yaml (P3-T1e, DP174).
  - stage: continents
  # Lakes, reservoirs and lagoons of 10 km2 or more, from OpenStreetMap, checked against HydroLAKES (P3-T1h, DP169).
  - stage: osm-layer
    source: planet
    layer: lakes
    queries:
      - {query: "a[natural=water][water=lake][name]", type: lake}
      - {query: "a[natural=water][water=reservoir][name]", type: reservoir}
      - {query: "a[natural=water][water=lagoon][name]", type: lagoon}
      # Some large lakes are tagged as ponds, such as the Etang de Berre.
      - {query: "a[natural=water][water=pond][name]", type: lake}
      - {query: "a[natural=water][!water][name]", type: lake}
      - {query: "a[landuse=reservoir][name]", type: reservoir}
    min_km2: 10
    tolerance_m: 100
    # The Caspian Sea is a lake in OpenStreetMap, but already in the Oceans and seas layer.
    same_as: [oceans, seas]
    check: hydrolakes-points
    check_km2: 100
    check_within_km: 2
  # Whole rivers of 50 km or more with a Wikidata link, from OpenStreetMap, checked against Natural Earth (P3-T1g, DP169).
  - stage: osm-rivers
    source: planet
    layer: rivers
    min_km: 50
    # A river relation with no Wikidata link, on it or on most of its ways, is kept from this length.
    min_km_unlinked: 200
    tolerance_m: 100
    check: naturalearth-rivers
    check_km: 500
    check_within_km: 5
  # Mountain ranges (GMBA) and physical regions (Natural Earth), cut to the land (P3-T1f, DAT-5, DP169).
  - stage: physical
    sources: [gmba-mountains, naturalearth-physical-regions, land-polygons]
    ranges:
      source: gmba-mountains
      layer: mountain-ranges
      # GMBA's levels 1 and 2 are continents and parts of them; below 7 the ranges are small and many.
      min_level: 3
      max_level: 7
      # GMBA's grouped sub-ranges, such as "Southeast Europe", only from this level down.
      sub_range_min_level: 4
      tolerance_m: 300
    regions:
      source: naturalearth-physical-regions
      layer: physical-regions
      tolerance_m: 300
      # Natural Earth's classes kept, and what each is called. Its islands, mountain ranges, continents and lakes
      # are left out, as the islands, mountain ranges, continents and lakes layers hold them.
      classes: {Plateau: plateau, Desert: desert, Plain: plain, Peninsula: peninsula, Pen/cape: peninsula,
                Basin: basin, Delta: delta, Valley: valley, Lowland: lowland, Tundra: tundra, Isthmus: isthmus,
                Wetlands: wetland, Gorge: gorge, Foothills: foothills, Depression: depression, Geoarea: region,
                Island group: group of islands}
  # Named peaks and volcanoes of 1,000 metres or more, as places, with their height (P3-T1f, DP169).
  - stage: osm-places
    source: planet
    layer: peaks
    queries:
      - {query: "n[natural=peak][name][ele>=1000]", type: peak, elevation: true}
      - {query: "n[natural=volcano][name][ele>=1000]", type: volcano, elevation: true}
  # Cities and towns, as places, with their population from OSM and the areas each is in (P3-T1j).
  - stage: osm-places
    source: planet
    layer: towns
    queries:
      - {query: "n[place=city][name]", type: city, population: true}
      - {query: "n[place=town][name]", type: town, population: true}
    within: [continents, countries, regions, islands, counties]
  # Motorways and trunk roads, and main railway lines, joined into one feature per road and country (P3-T1i).
  # Tried only on the Western Europe trial so far.
  - stage: osm-lines
    source: planet
    tolerance_m: 100
    layers:
      - layer: roads
        key: ref
        unnamed: Unnamed road
        queries:
          - {query: "w[highway=motorway]", type: motorway}
          - {query: "w[highway=trunk]", type: trunk road}
      - layer: railways
        key: name
        unnamed: Unnamed railway line
        number_name: Railway line
        queries:
          - {query: "w[railway=rail][highspeed=yes][!service]", type: high-speed railway}
          - {query: "w[railway=rail][usage=main][!service]", type: railway}
  - stage: write
    drawing_levels:
      # The zoom each serves is the view radius in kilometres (architecture 6.9). The core picks the finest
      # level whose view_km is not more than the view radius, and the exact pack tiles when there is none.
      # Each level serves a frame of about 10,000 points a layer (VIS-1). The first build (5 km, 1 km and 200 m)
      # gave 77,000 points for the countries alone at world zoom and a pack of 170 MB, so these are coarser.
      - {tolerance_m: 40000, min_km2: 20000, tile_level: 1, view_km: 4000}
      - {tolerance_m: 8000, min_km2: 1000, tile_level: 3, view_km: 1000}
      - {tolerance_m: 1500, min_km2: 40, tile_level: 5, view_km: 150}
  - stage: checks
    places:
      - tests/acceptance/coastline_places.yaml
      - tests/acceptance/coastline_places_belgium.yaml
      - tests/acceptance/coastline_places_stage2.yaml
      - tests/acceptance/coastline_places_stage3.yaml
      - tests/acceptance/coastline_places_stage4.yaml
      - tests/acceptance/sea_places.yaml
      - tests/acceptance/continent_places.yaml
    line_180: true
    area_checks:
      # Wikidata's figures for area (P2046), the preferred one first. Wikidata's areas include inland
      # water for most countries, and the pack's are land cut to the coast, so a small difference is expected.
      - {name: Antarctica, wikidata_km2: [13720000, 14000000, 14200000], tolerance_pct: 2,
         note: "Wikidata's preferred figure, 13,720,000 km2, is the land without ice shelves."}
      - {name: Fiji, wikidata_km2: [18274], tolerance_pct: 5}
      - {name: Russia, wikidata_km2: [17075400], tolerance_pct: 5}
      - {name: United States, wikidata_km2: [9826675], tolerance_pct: 8}
      # Listed as explained (DP118): atolls have wide reef flats and sand that are land at low tide, and the check
      # here does not take away inland water as the spike S2 check did (that left Kiribati 6.1% over).
      - {name: Kiribati, wikidata_km2: [811], tolerance_pct: 40, note: "Explained (DP118): reef flats and sand, and lagoons not taken away."}
