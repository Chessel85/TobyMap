# Copy this file to paths.yaml in the same folder, and set your own data folder.
# paths.yaml is not in git, because it holds a folder on your own computer (AD-18).
# The --data option and the MAPDATA_ROOT environment variable override it.
# mapdata reads source files such as planet .osm.pbf and .gol files from the data folder,
# and writes only inside its own subfolder, tobymap, which it creates.
data_folder: D:\path\to\your\osmdata
