# Every source a pack can be built from (architecture 8.4, DMT-6, DAT-9, DAT-11).
# The reference for each setting is docs/data-manager/configuration.md.
#
# A source with no licence or no attribution stops every build, naming the
# source. Each source must also be in docs/design/data sources.md, with a
# licence that allows packs to be shared under the ODbL.
#
# Where a source comes from is one or more of:
#   url and file: downloaded by "mapdata fetch" into the data folder's tobymap\downloads folder, as file.
#   find: a local copy already in the data folder, such as the planet files. The newest match is used.
#   repo: a file or folder in this repository, such as the test samples.

sources:
  planet:
    name: OpenStreetMap planet file, as a GeoDesk library
    about: The whole of OpenStreetMap. Downloaded and converted by hand, as it takes some hours (P1-T16).
    url: https://planet.openstreetmap.org/pbf/
    find:
      - tobymap/downloads/planet-*/planet-*.gol
      - planet-*.gol
    licence: ODbL 1.0
    attribution: © OpenStreetMap contributors
    refresh_days: 90

  land-polygons:
    name: OSM land polygons, split, in longitude and latitude
    about: All the land in the world, with the sea taken away, used to cut areas to the coast (AD-15).
    url: https://osmdata.openstreetmap.de/download/land-polygons-split-4326.zip
    file: osm-land-polygons/land-polygons-split-4326.zip
    licence: ODbL 1.0
    attribution: © OpenStreetMap contributors
    refresh_days: 90

  vliz-oceans:
    name: Flanders Marine Institute (VLIZ), Global Oceans and Seas, version 1
    about: The ten oceans and ocean regions, based on IHO S-23, from VLIZ's map server (DOI 10.14284/542).
    url: https://geo.vliz.be/geoserver/MarineRegions/wfs?service=WFS&version=1.0.0&request=GetFeature&typeName=MarineRegions:goas&outputFormat=application/json
    file: vliz-oceans/goas.geojson
    licence: CC-BY 4.0
    attribution: Flanders Marine Institute (2021). Global Oceans and Seas, version 1. Available online at https://www.marineregions.org/. https://doi.org/10.14284/542
    refresh_days: 365

  naturalearth-countries-110m:
    name: Natural Earth, admin 0 countries, 1:110 million
    about: A simple world, for the globe spike and the test pack.
    url: https://raw.githubusercontent.com/nvkelso/natural-earth-vector/master/geojson/ne_110m_admin_0_countries.geojson
    file: naturalearth/ne_110m_admin_0_countries.geojson
    licence: Public domain
    attribution: Made with Natural Earth. Free vector and raster map data at naturalearthdata.com.
    refresh_days: 365

  naturalearth-geographic-lines:
    name: Natural Earth, geographic lines, 1:10 million
    about: The international date line, which is not straight (DAT-13). The graticule stage reads only that line.
    url: https://raw.githubusercontent.com/nvkelso/natural-earth-vector/master/geojson/ne_10m_geographic_lines.geojson
    file: naturalearth/ne_10m_geographic_lines.geojson
    licence: Public domain
    attribution: Made with Natural Earth. Free vector and raster map data at naturalearthdata.com.
    refresh_days: 365

  naturalearth-marine-areas:
    name: Natural Earth, marine areas, 1:10 million
    about: Named seas, gulfs, bays, straits, sounds, channels, fjords and lagoons, for the Seas layer (P3-T1b, DP168).
    url: https://raw.githubusercontent.com/nvkelso/natural-earth-vector/master/geojson/ne_10m_geography_marine_polys.geojson
    file: naturalearth/ne_10m_geography_marine_polys.geojson
    licence: Public domain
    attribution: Made with Natural Earth. Free vector and raster map data at naturalearthdata.com.
    refresh_days: 365

  # The test pack's samples, kept in the repository (architecture 11.1).
  # tests/samples/README.md says how each was made.
  naturalearth-physical-regions:
    name: Natural Earth, physical regions, 1:10 million
    about: Named physical regions, such as deserts, plateaus, plains, peninsulas and mountain ranges, for the Physical regions layer (P3-T1f, DAT-5).
    url: https://raw.githubusercontent.com/nvkelso/natural-earth-vector/master/geojson/ne_10m_geography_regions_polys.geojson
    file: naturalearth/ne_10m_geography_regions_polys.geojson
    licence: Public domain
    attribution: Made with Natural Earth. Free vector and raster map data at naturalearthdata.com.
    refresh_days: 365

  naturalearth-rivers:
    name: Natural Earth, rivers and lake centre lines, 1:10 million
    about: The world's main rivers, used only to check that the rivers read from OpenStreetMap miss none (P3-T1g).
    url: https://raw.githubusercontent.com/nvkelso/natural-earth-vector/master/geojson/ne_10m_rivers_lake_centerlines.geojson
    file: naturalearth/ne_10m_rivers_lake_centerlines.geojson
    licence: Public domain
    attribution: Made with Natural Earth. Free vector and raster map data at naturalearthdata.com.
    refresh_days: 365

  gmba-mountains:
    name: GMBA Mountain Inventory, version 2.0, standard
    about: The world's mountain ranges, with their own hierarchy of ranges, for the Mountain ranges layer (P3-T1f, DAT-5). DOI 10.48601/earthenv-t9k2-1407.
    url: https://data.earthenv.org/mountains/standard/GMBA_Inventory_v2.0_standard.zip
    file: gmba/GMBA_Inventory_v2.0_standard.zip
    licence: CC-BY 4.0
    attribution: "Snethlage, M.A., Geschke, J., Spehn, E.M., Ranipeta, A., Yoccoz, N.G., Körner, Ch., Jetz, W., Fischer, M. & Urbach, D. GMBA Mountain Inventory v2. GMBA-EarthEnv. https://doi.org/10.48601/earthenv-t9k2-1407"
    refresh_days: 730

  hydrolakes-points:
    name: HydroLAKES, version 1.0, lake points
    about: A point and an area for every lake of 10 hectares or more, used only to check that the lakes read from OpenStreetMap miss no large lake (P3-T1h).
    url: https://data.hydrosheds.org/file/hydrolakes/HydroLAKES_points_v10_shp.zip
    file: hydrolakes/HydroLAKES_points_v10_shp.zip
    licence: CC-BY 4.0
    attribution: "Messager, M.L., Lehner, B., Grill, G., Nedeva, I., Schmitt, O. (2016). Estimating the volume and age of water stored in global lakes using a geo-statistical approach. Nature Communications 7: 13603. HydroLAKES, www.hydrosheds.org."
    refresh_days: 730

  naturalearth-disputed:
    name: Natural Earth, admin 0 breakaway and disputed areas, 1:10 million
    about: "Land whose sovereignty is disputed or that has broken away, each with Natural Earth's note of who holds and who claims it (P3-T2c, ANN-6, DAT-8)."
    url: https://raw.githubusercontent.com/nvkelso/natural-earth-vector/master/geojson/ne_10m_admin_0_disputed_areas.geojson
    file: naturalearth/ne_10m_admin_0_disputed_areas.geojson
    licence: Public domain
    attribution: Made with Natural Earth. Free vector and raster map data at naturalearthdata.com.
    refresh_days: 365

  wikidata:
    name: Wikidata, facts fetched from its query service
    about: "Population, area, capital, elevation, length, official name, kind and Wikipedia title of each feature with a Wikidata link (P3-T2a). The build fetches them itself, as it runs, into the folder wikidata in the downloads folder, and keeps them, so a rebuild fetches nothing again."
    url: https://query.wikidata.org/sparql
    folder: wikidata
    licence: CC0 1.0
    attribution: "Facts from Wikidata, available under CC0: https://www.wikidata.org/"
    refresh_days: 180

  sample-ne-disputed:
    name: Natural Earth, breakaway and disputed areas, Crimea only, test sample
    repo: tests/samples/naturalearth-disputed-crimea.geojson
    date: 2026-11-13
    licence: Public domain
    attribution: Made with Natural Earth. Free vector and raster map data at naturalearthdata.com.

  sample-wikidata:
    name: Wikidata, facts for the test pack's samples
    repo: tests/samples/wikidata
    date: 2026-11-13
    licence: CC0 1.0
    attribution: "Facts from Wikidata, available under CC0: https://www.wikidata.org/"

  sample-world:
    name: Natural Earth, admin 0 countries, 1:110 million, test sample
    repo: tests/samples/world-naturalearth-110m.geojson
    date: 2026-11-03
    licence: Public domain
    attribution: Made with Natural Earth. Free vector and raster map data at naturalearthdata.com.

  sample-oceans:
    name: VLIZ Global Oceans and Seas, version 1, the Atlantic, test sample
    repo: tests/samples/oceans-vliz-atlantic.geojson
    date: 2026-11-03
    licence: CC-BY 4.0
    attribution: Flanders Marine Institute (2021). Global Oceans and Seas, version 1. Available online at https://www.marineregions.org/. https://doi.org/10.14284/542

  sample-osm:
    name: OpenStreetMap, small test samples
    repo: tests/samples/osm
    date: 2026-10-31
    licence: ODbL 1.0
    attribution: © OpenStreetMap contributors
