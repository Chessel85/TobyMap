# The territories list (P3-T24c, DP199): the legal status of each place in the Countries layer that belongs to
# a country but is not the country itself, and whether its sovereign state is said after it.
#
# The definition is "Distant parts and the sovereign state" in docs/design/Discussion points detail - responses.md.
# The law decides whether a country is said, not the continent. The sovereign state is said after an integral
# part, such as the Canary Islands, and not after a dependent territory, such as Jersey.
#
# Made on 17 November 2026 from Natural Earth's countries (ne_10m_admin_0_countries, its TYPE and SOVEREIGNT)
# and Wikidata (what each place is an instance of, P31, and its country, P17), both read that day. Each entry
# says what each source says, in source. A grey case is marked grey: yes, with a note saying why it was decided
# as it was, for the product owner to confirm or change.
#
# Each entry:
# * place: its name, as a reminder; the build uses the identifiers.
# * wikidata: its Wikidata item, which finds it in the data: a Countries area with this link, or the region a
#   distant part was named after. id: the area's own identifier, for an area with no Wikidata link.
# * sovereign: the sovereign state, as it is said. sovereign_wikidata: its Wikidata item, to find its area in the
#   Countries layer; left out where the sovereign is not a country area, as for the British Crown.
# * status: one of integral part, autonomous part, Crown Dependency, overseas territory, freely associated state,
#   disputed.
# * say_sovereign: yes or no, whether the sovereign state is said after it.
# * separate: yes, for a territory OpenStreetMap maps inside its country, as a region of it: the build makes it
#   an area of the Countries layer of its own, as Puerto Rico. Left out for no.
# * claimed_by: another country that claims it, said in Details.
# * grey: yes for a grey case, with note. source: what Natural Earth and Wikidata say.
#
# A test checks every entry when the build starts (mapdata/stages/territories.py): each field present, the status
# one of the known ones, and, in a build of the whole world, each identifier found in the data. A mistake stops
# the build at once, naming the entry.

