# Coastline check places (artefacts section 8, architecture 12.3, DAT-3, DAT-14).
# Spike S2 stage 1: the UK, France and Spain.
#
# For each place: its latitude and longitude, and either "sea: true", meaning
# no land area may contain it, or "includes": names that must all be among the
# areas containing it. A name matches an area's English name or its local
# name, so "Corse-du-Sud" and "South Corsica" are both accepted. The PO may
# add places.

