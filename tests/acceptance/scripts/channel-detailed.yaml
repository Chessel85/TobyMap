title: "Across the Channel with the detailed preset: the whole place when an area changes"
requirements: [ACC-5, ANN-1]
pack: test
start: {lat: 51.2, lon: 1.2, zoom_m: 25000, step_m: 25000}
steps:
  - {run: settings.set, args: {field: verbosity, value: detailed}}
  - {press: Down, say: ["North Atlantic Ocean"]}
  - {press: Right, earcons: [tick]}
  - {press: Right, say: ["Pas-de-Calais, Hauts-de-France, France"]}
  - {press: Down, earcons: [tick]}
  - {press: Down, earcons: [tick]}
  - {press: Down, say: ["Somme, Hauts-de-France, France"]}
  - {press: Left, earcons: [tick]}
  - {press: Left, say: ["North Atlantic Ocean"]}
