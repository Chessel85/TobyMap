<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TobyMap</title>
<link rel="stylesheet" href="css/app.css">
<!-- Cross-origin isolation, so the spatial voice can use four threads (DP105, P2-T7b). Where the
     server cannot send the headers, as on GitHub Pages, this helper script adds them, and reloads
     the page once on the first visit. ?threads=1 in the address leaves it out. -->
<script>window.coi = { shouldRegister: () => new URLSearchParams(location.search).get("threads") !== "1", quiet: true };</script>
<script src="coi-serviceworker.js"></script>
</head>
<body>
<!-- The four regions (UX section 2). Tab and Shift+Tab move between the map,
     the Information panel and Details, and wrap round; Ctrl+Alt+M reaches the
     menu bar (DP93). Their names, and every word spoken, come from the core once it
     has loaded; only the loading message below is written in the page. -->
<div id="menubar" role="menubar" aria-label="Menu bar" hidden></div>
<main id="app" aria-busy="true">
  <p id="loading">Loading TobyMap. This can take a few seconds the first time.</p>
  <!-- The map region. The focused element, #map, is a small square at the centre of the map,
       so a magnifier that follows the keyboard focus keeps the location in view (ACC-8, DP146). -->
  <div id="left">
    <div id="map-area" hidden>
      <canvas id="canvas" aria-hidden="true"></canvas>
      <div id="map" role="application" aria-label="Map" tabindex="0"></div>
    </div>
    <!-- The status line and the move and zoom buttons (P3-T18). Built from the core's words. Not in the
         Tab order, not a live region; a press on a button leaves the focus on the map. -->
    <div id="controls" hidden>
      <p id="status"></p>
      <div id="control-buttons" role="group"></div>
    </div>
  </div>
  <div id="side" hidden>
    <ul id="tree" role="tree" aria-label="Information panel"></ul>
    <textarea id="details" readonly aria-label="Details" spellcheck="false"></textarea>
  </div>
</main>
<dialog id="dialog" aria-labelledby="dialog-title">
  <h2 id="dialog-title"></h2>
  <!-- wrap="off": one line of text is one line on screen, so the screen reader
       moves a line at a time (PO feedback on checklist 2). -->
  <textarea id="dialog-text" readonly spellcheck="false" wrap="off"></textarea>
  <button id="dialog-close" type="button">Close</button>
</dialog>
<!-- The settings dialog and the key dialog are built by the page from what the core gives it,
     so the web version shows the same settings as the desktop. -->
<dialog id="settings"></dialog>
<dialog id="keydialog"></dialog>
<dialog id="inputdialog"></dialog>
<!-- A message box over the bearing or Go to box when what was typed can't be read: the core's
     words and an OK button, which the page adds with the core's word (P2-T17o). -->
<dialog id="messagebox" role="alertdialog" aria-labelledby="messagebox-title" aria-describedby="messagebox-text">
  <h2 id="messagebox-title"></h2>
  <p id="messagebox-text"></p>
</dialog>
<dialog id="layersdialog"></dialog>
<dialog id="searchdialog"></dialog>
<dialog id="treedialog"></dialog>
<dialog id="querydialog"></dialog>
<!-- The announcer's live regions, two of each kind so that a repeated
     message is still spoken (architecture 4.4). -->
<div class="visually-hidden">
  <div id="live-polite-a" aria-live="polite"></div>
  <div id="live-polite-b" aria-live="polite"></div>
  <div id="live-assertive-a" aria-live="assertive"></div>
  <div id="live-assertive-b" aria-live="assertive"></div>
</div>
<script type="module" src="js/main.js"></script>
</body>
</html>
